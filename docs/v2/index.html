<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Painel Comercial · v2 — Grupo Humanidade</title>
<!-- ============================================================futuro leitor
  PAINEL COMERCIAL v2 — layout novo, lado a lado com o atual (../index.html).
  NÃO substitui nada: mesmo Cofre, mesma porta, mesmo token (hub_token_gestao).
  Cache local próprio (painel_v2_cache) para não interferir no painel atual.

  De onde vem cada número:
   · PS: GET ?app=vendas&fn=dados  -> {vendas[], meses[], metas{}, atualizado_em}
         desconto em PONTOS PERCENTUAIS (5.26 = 5,26%)
   · EU: GET ?app=estrela&fn=dados -> {vendas[], estoque[], rotulos, atualizado_em}
         desconto em FRAÇÃO (0.0526 = 5,26%)
  Toda conta é feita AQUI, no navegador — a porta não mudou uma linha.
  Regras herdadas do painel atual: estoque "à venda" exclui a Fase 2 do Vale;
  ritmo = vendas 12m ÷ 12; cobertura = lotes à venda ÷ ritmo.
============================================================================ -->
<style>
  :root{
    color-scheme:dark;
    --bg:#0b1220; --card:#121b2e; --card2:#0e1626; --edge:rgba(255,255,255,.07);
    --ink:#eef2fa; --ink2:#9aa9c4; --muted:#64718c;
    --grid:#1e2940; --axis:#2a3752;
    --blue:#4A8FE0; --mag:#D55181; --gray:#48566e;
    --good:#0ca30c; --crit:#d03b3b;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  /* o tema segue a empresa aberta: PS = dourado da marca · EU = ciano */
  body.emp-ps{ --accent:#C08708; --chipbg:#CC900B; --chiptx:#1a1302; --warn:#ec835a; --warnbg:rgba(236,131,90,.12) }
  body.emp-eu{ --accent:#14A3BC; --chipbg:#14A3BC; --chiptx:#04222b; --warn:#fab219; --warnbg:rgba(250,178,25,.1) }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  body.emp-ps{background-image:radial-gradient(1100px 500px at 85% -10%,rgba(204,144,11,.08),transparent 60%)}
  body.emp-eu{background-image:radial-gradient(1100px 500px at 85% -10%,rgba(20,163,188,.08),transparent 60%)}
  .wrap{max-width:1240px;margin:0 auto;padding:18px 22px 56px}

  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:38px;height:38px;border-radius:10px;background:#EA641B;display:grid;place-items:center;flex:none}
  .brand h1{font-size:17px;font-weight:650;letter-spacing:.01em}
  .brand h1 .v2{font-size:10px;font-weight:700;letter-spacing:.08em;vertical-align:3px;margin-left:6px;
     color:var(--ink2);border:1px solid var(--axis);border-radius:6px;padding:1px 6px}
  .brand .sub{font-size:12px;color:var(--ink2)}
  .toplinks{margin-left:auto;display:flex;gap:8px;align-items:center}
  .toplinks a{color:var(--muted);font-size:11.5px;text-decoration:none;border:1px solid var(--edge);
     border-radius:8px;padding:5px 10px;background:var(--card2)}
  .toplinks a:hover{color:var(--ink2)}

  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}
  .seg{display:flex;background:var(--card2);border:1px solid var(--edge);border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:12.5px;
     color:var(--ink2);cursor:pointer;font-family:inherit}
  .seg button[aria-selected="true"]{background:var(--chipbg);color:var(--chiptx);font-weight:650}
  select.chip{appearance:none;-webkit-appearance:none}
  .chip{padding:6px 13px;border:1px solid var(--edge);background:var(--card2);border-radius:10px;
     font-size:12.5px;color:var(--ink);font-family:inherit;cursor:pointer}
  .chip b{color:var(--ink);font-weight:600}
  .chip .lbl{color:var(--ink2)}
  #btRec{display:inline-flex;align-items:center;gap:7px}
  #btRec svg{transition:transform .3s}
  #btRec.girando svg{animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0)),var(--card);
        border:1px solid var(--edge);border-radius:16px;padding:16px 18px;position:relative;min-width:0}
  .card h3{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
  .card .why{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .card .why.rodape{margin:8px 0 0}
  .anuncio-falta{margin-top:6px;font-size:11.5px;line-height:1.5;color:var(--warn);background:var(--warnbg);
    border-radius:6px;padding:6px 8px}
  .anuncio-falta b{font-weight:700}
  .anuncio-detalhe{margin-top:6px;font-size:11.5px;line-height:1.6;color:var(--ink2)}
  .anuncio-detalhe b{color:var(--ink);font-weight:700}
  .anuncio-detalhe em{font-style:normal;color:var(--ink);font-weight:700}
  .s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}
  .s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
  @media(max-width:980px){.s8,.s7,.s6,.s5,.s4,.s3{grid-column:span 12}}
  .sect{grid-column:span 12;display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .sect h2{font-size:13px;font-weight:650;color:var(--ink)}
  .sect .ln{flex:1;height:1px;background:var(--grid);min-width:40px}
  .sect .tag{font-size:10.5px;color:var(--muted)}

  .tile .val{font-size:30px;font-weight:650;margin:2px 0 1px}
  .tile .val small{font-size:15px;color:var(--ink2);font-weight:500}
  /* aba Como o cliente paga (19/09/26): o grau de certeza embaixo do número, e
     o ponto colorido que liga tabela e barra — ali a cor é legenda, não enfeite */
  .tile .st{font-size:11.5px;color:var(--ink2)}
  .certeza{font-size:11px;margin-top:4px}
  .c-fato{color:#2fbf4f}.c-quase{color:var(--ink2)}.c-prev{color:var(--warn)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  /* ABERTURA DA ABA — o MESMO tamanho e o mesmo respiro da Esteira e do Perfil
     do Cliente (19/09/26). As três telas abrem do mesmo jeito: sobrescrita em
     caixa alta, título, um parágrafo que diz de onde o número vem, e só então
     os cartões. Medidas iguais nos três arquivos, de propósito: tela de gestão
     que muda de régua a cada aba faz o leitor reaprender a ler. */
  .cpHead{grid-column:span 12;padding:18px 0 24px;border-bottom:1px solid var(--grid);margin-bottom:2px}
  .cpHead .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
    color:var(--accent);margin:0 0 12px}
  .cpHead .tit{font-size:clamp(26px,4.4vw,38px);font-weight:800;line-height:1.12;
    letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
  .cpHead .deck{font-size:15px;line-height:1.6;color:var(--ink2);margin:0 0 18px}
  .cpHead .deck b{color:var(--ink);font-weight:700}
  .cpHead .escopo{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0}
  .cpHead .seg{margin:0 0 16px;width:max-content;max-width:100%;flex-wrap:wrap}
  .cpHead .escopo b{color:var(--ink2);font-weight:700}
  /* o rodapé de notas ocupa a faixa inteira: sem isto ele cai numa coluna do
     grid de 12 e o texto sai quebrado letra a letra (visto em 19/09) */
  .notas{grid-column:span 12;background:var(--card2);border:1px solid var(--edge);
    border-radius:12px;padding:13px 15px;font-size:12px;color:var(--ink2);line-height:1.55}
  .notas b{color:var(--ink)}
  .notas p{margin:0 0 8px}
  .notas p:last-child{margin:0}
  /* barra de 100% dentro de card largo: o SVG do quebraCard tem 320 de viewBox
     e, esticado na faixa de 12 colunas, escala a fonte junto — o teto segura a
     proporção em que ele foi desenhado */
  .barra320{max-width:360px}   /* mesma escala das barras dos cards de 4 colunas */
  /* SELO DE RÉGUA (19/09/26). A tela mistura duas perguntas — o que o mês
     VENDEU e o dinheiro que ficou DISPONÍVEL nele — e quem lê pela primeira
     vez não tem como saber qual é qual. Agora cada caixa de número carrega o
     selo da régua a que pertence, e a seção diz o período. */
  .selo{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 7px;
    margin:0 0 8px}
  .selo.venda{color:var(--accent);background:rgba(192,135,8,.14)}
  .selo.caixa{color:var(--blue);background:rgba(74,143,224,.14)}
  .sect .tot{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .sect .tot b{color:var(--ink);font-weight:700}
  .delta{font-size:12px;font-weight:600}
  .delta.up{color:#2fbf4f}.delta.down{color:#e46a6a}.delta.flat{color:var(--ink2)}
  .delta .vs{color:var(--muted);font-weight:400}
  .hero .val{font-size:48px;letter-spacing:-.01em}
  /* vendas do dia, dentro do KPI do mês — quem vendeu hoje, com nome.
     Fica no rodapé do card do mês de propósito: o número grande é o mês; o
     dia é a leitura de quem está em campo agora. Só no mês corrente. */
  .hoje{margin-top:12px;padding-top:10px;border-top:1px solid var(--edge)}
  .hoje .lb{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .hoje .n{font-size:20px;font-weight:650;margin:1px 0 2px}
  .hoje .n small{font-size:12.5px;color:var(--ink2);font-weight:500}
  .hoje .nomes{font-size:12px;color:var(--ink2);line-height:1.5}
  /* quinzenas: 1ª | 2ª, no rodapé do KPI do mês */
  .quinz .qz{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;margin-top:7px;font-size:11.5px}
  .quinz .rot{color:var(--muted);line-height:1.2} .quinz .rot small{display:block;font-size:10px;color:var(--muted);opacity:.8}
  .quinz .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#1c2740}
  .quinz .bar span{display:block;background:var(--accent)} .quinz .bar span.b{background:var(--accent);opacity:.45}
  .quinz .num{color:var(--ink2);white-space:nowrap} .quinz .num b{color:var(--ink)} .quinz .num i{color:var(--muted);font-style:normal;margin:0 3px}
  .gauge-pct{fill:var(--ink);font-size:21px;font-weight:650}
  .hoje .nomes b{color:var(--ink);font-weight:600}
  .hoje .vazio{padding:3px 0 0;font-size:12px}
  .vazio{color:var(--muted);font-size:12.5px;padding:14px 0}

  svg{display:block}
  svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .axis-t{fill:var(--muted);font-size:10.5px}
  .lab-t{fill:var(--ink2);font-size:11px}
  .val-t{fill:var(--ink);font-size:11.5px;font-weight:600}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px}
  /* controles do termômetro, dentro do card */
  .termobar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px}
  .termobar .seg{padding:2px}
  .termobar .seg button{padding:4px 11px;font-size:11.5px}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);cursor:pointer;
        background:var(--card2);border:1px solid var(--edge);border-radius:9px;padding:5px 10px}
  .chk input{accent-color:var(--accent);margin:0}

  /* ---------- expandir gráfico ----------
     Um botão por card que tenha gráfico. Abrir NAO move nada de lugar: o SVG
     ja e width:100%, entao basta o card ocupar a tela que o desenho cresce
     junto — e tooltip e crosshair seguem ligados, porque nenhum no saiu do
     DOM. Clonar o SVG teria perdido os listeners; mover, teria quebrado a
     volta. z-index 65 e deliberado: acima do selo (60) e ABAIXO do tooltip
     (70), senao a dica sumiria atras do proprio grafico expandido. */
  /* copiar como imagem (18/09): mora na mesma barrinha (.btacoes) que o
     expandir, mas vale para TODO card do grid, com gráfico ou não. A barrinha
     fica de fora da foto (filtro em copiarCard). */
  .btacoes{position:absolute;top:9px;right:10px;z-index:2;display:flex;gap:5px}
  .btexp,.btcopia{display:inline-flex;align-items:center;
        gap:5px;background:var(--card2);border:1px solid var(--edge);color:var(--ink2);
        border-radius:8px;padding:4px 8px;font:inherit;font-size:11px;line-height:1.35;cursor:pointer;
        opacity:.5;transition:opacity .15s}
  .btcopia{padding:4px 6px}
  .card:hover .btacoes button,.btacoes button:hover,.btacoes button:focus-visible{opacity:1}
  .btacoes svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;
        stroke-linecap:round;stroke-linejoin:round}
  .btcopia.ok{color:var(--good);opacity:1}
  .btcopia.erro{color:var(--crit);opacity:1}
  .btcopia[disabled]{cursor:progress}
  .card.expandido{position:fixed;inset:0;z-index:65;margin:0;border-radius:0;border:0;
        overflow:auto;padding:52px 20px 28px;background:var(--bg)}
  .card.expandido .btacoes{position:fixed;top:14px;right:16px}
  .card.expandido .btacoes button{opacity:1}
  body.expandindo{overflow:hidden}
  @media(max-width:640px){
    .btacoes{top:7px;right:8px}
    .btexp,.btcopia{padding:4px 7px}
    .btacoes .rot{display:none}
    .card.expandido{padding:48px 12px 24px}
  }
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

  .statuschip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:8px;padding:4px 10px}
  .statuschip.warn{color:var(--warn);background:var(--warnbg)}
  .statuschip.good{color:#2fbf4f;background:rgba(12,163,12,.12)}
  .statuschip.crit{color:#e46a6a;background:rgba(208,59,59,.12)}

  /* ---------- meta em blocos ----------
     Faixa horizontal de checkpoints. `flex:1 1 150px` faz os 3 decêndios
     ocuparem a largura toda e as 5 semanas quebrarem sozinhas no celular. */
  .blocos{display:flex;gap:10px;flex-wrap:wrap}
  .bloco{flex:1 1 150px;background:var(--card2);border:1px solid var(--edge);border-radius:12px;padding:11px 12px}
  .bloco.curso{border-color:var(--accent)}
  .bloco.futuro{opacity:.62}
  .bloco .per{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .bloco .n{font-size:24px;font-weight:650;margin:3px 0 1px;font-variant-numeric:tabular-nums}
  .bloco .n small{font-size:13px;color:var(--ink2);font-weight:500}
  .bloco .bar{height:6px;border-radius:4px;background:var(--grid);overflow:hidden;margin:7px 0 6px}
  .bloco .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .bloco .bar i.ok{background:#2fbf4f}
  .bloco .bar i.ruim{background:#e46a6a}
  .bloco .st{font-size:11px;color:var(--ink2)}

  table.placar{width:100%;border-collapse:collapse;font-size:12.5px}
  table.placar td,table.placar th{padding:7px 8px;text-align:left}
  table.placar th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
     font-weight:600;border-bottom:1px solid var(--grid)}
  table.placar td.num{text-align:right;font-variant-numeric:tabular-nums}
  table.placar tr+tr td{border-top:1px solid rgba(255,255,255,.04)}

  .lock{opacity:.95}
  .lock .body{filter:saturate(.4) brightness(.85);opacity:.6;pointer-events:none}
  .lockchip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--ink2);
     background:var(--card2);border:1px dashed var(--axis);border-radius:7px;padding:3px 9px}
  .need{font-size:11px;color:var(--warn);margin-top:9px}

  .tip{position:fixed;pointer-events:none;background:#060b16;border:1px solid var(--axis);border-radius:9px;
       padding:7px 11px;font-size:12px;color:var(--ink);opacity:0;transition:opacity .12s;z-index:70;
       box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:260px}
  .tip span{color:var(--ink2)}

  body.emp-ps #viewEU{display:none}
  body.emp-eu #viewPS{display:none}
  body.emp-eu .so-ps{display:none}
  body.emp-ps .so-eu{display:none}

  /* ---- portão e carga (mesmo desenho do painel atual) ---- */
  #gate{position:fixed;inset:0;z-index:9999;background:#0b1220;display:flex;align-items:center;
        justify-content:center;padding:24px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  #gate .box{width:100%;max-width:400px;background:rgba(255,255,255,.05);
        border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:26px}
  #gate h2{color:#e8eefb;font-size:19px;margin:0 0 6px;font-weight:650}
  #gate p{color:#93a3b8;font-size:13.5px;margin:0 0 18px;line-height:1.5}
  #gate input{width:100%;background:rgba(255,255,255,.07);color:#e8eefb;border:1px solid rgba(255,255,255,.14);
        border-radius:10px;padding:12px 14px;font-size:15px;outline:none;font-family:inherit}
  #gate input:focus{border-color:#60a5fa}
  #gate button{width:100%;margin-top:12px;background:#2563eb;color:#fff;border:0;border-radius:10px;
        padding:12px;font-size:15px;font-weight:650;cursor:pointer;font-family:inherit}
  #gate button:disabled{opacity:.5;cursor:default}
  #gate .err{color:#f87171;font-size:13px;margin-top:12px;min-height:18px;line-height:1.45}
  #carga{position:fixed;inset:0;z-index:9998;background:#0b1220;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:22px;transition:opacity .3s;color:#93a3b8;
        font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
  /* ---------- a bola ----------
     Mesma bola do arranque do painel atual (docs/index.html), trazida daqui
     por copia literal: os tempos sao calibrados entre si e reescrever de
     memoria e onde a animacao perde o passo. 56px de diametro dao 176px de
     circunferencia, e o percurso de ida e exatamente 176px — ela rola de
     verdade, nao patina. Mexeu no tamanho? recalcule o translateX. */
  .pista{position:relative;width:200px;height:112px}
  .pista .chao{position:absolute;left:50%;bottom:-6px;width:70px;height:8px;margin-left:-35px;
        border-radius:50%;background:rgba(255,255,255,.13);filter:blur(3px);
        animation:carga-sombra 1.1s linear infinite}
  .pista .roda{position:absolute;left:50%;bottom:0;width:56px;height:56px;margin-left:-28px;
        animation:carga-rolar 2.2s ease-in-out infinite alternate}
  .pista .salta{width:100%;height:100%;animation:carga-pular .55s ease-out infinite alternate}
  .pista .amassa{width:100%;height:100%;transform-origin:50% 100%;
        animation:carga-amassar 1.1s linear infinite}
  .pista .bola{display:block;width:100%;height:100%;color:#fff;
        animation:carga-girar 2.2s ease-in-out infinite alternate}
  .pista .bola svg{display:block;width:100%;height:100%}
  /* 56px de diametro dao 176px de circunferencia — o percurso de ida (176px)
     e exatamente uma volta, entao ela rola de verdade, nao patina. */
  @keyframes carga-rolar  {from{transform:translateX(-88px)} to{transform:translateX(88px)}}
  @keyframes carga-girar  {from{transform:rotate(-360deg)}   to{transform:rotate(360deg)}}
  @keyframes carga-pular  {from{transform:translateY(0)}     to{transform:translateY(-46px)}}
  @keyframes carga-amassar{0%,100%{transform:scale(1.10,.88)} 14%,86%{transform:scale(1,1)}}
  @keyframes carga-sombra {0%,100%{opacity:.9;transform:scaleX(1)} 50%{opacity:.35;transform:scaleX(.62)}}
  @media(max-width:480px){
    .pista{width:170px;height:96px}
    .pista .roda{width:46px;height:46px;margin-left:-23px}
    @keyframes carga-rolar{from{transform:translateX(-72px)} to{transform:translateX(72px)}}}
  @media(prefers-reduced-motion:reduce){
    .pista .roda,.pista .salta,.pista .amassa,.pista .bola,.pista .chao{animation:none}
    .pista .bola{opacity:.85}}
  #selo{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(11,18,32,.94);
        border-top:1px solid rgba(255,255,255,.09);color:#7d8ea6;
        font:11.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
        padding:7px 14px;text-align:center;backdrop-filter:blur(8px)}
  #selo b{color:#a9b8cc;font-weight:600}

<script>
/* ================================================================== util */
var $ = function (s, r) { return (r || document).querySelector(s); };
function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s) { return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) { return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]; }); }

var fN = function (x, d) { return Number(x || 0).toLocaleString('pt-BR', { maximumFractionDigits: d == null ? 0 : d, minimumFractionDigits: d == null ? 0 : d }); };
function fBRL(x) {
  x = Number(x || 0);
  if (Math.abs(x) >= 995e3) return 'R$ ' + fN(x / 1e6, 1) + ' mi';
  if (Math.abs(x) >= 1e3) return 'R$ ' + fN(x / 1e3, 0) + ' mil';
  return 'R$ ' + fN(x, 0);
}
function fPct(x, d) { return fN(x, d == null ? 1 : d) + '%'; }

var MES_ABREV = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* Termômetro: onde a série de referência começa. Jan–mar/26 é gestão
   anterior — 18 vendas em três meses — e contamina qualquer mediana.
   Daqui para a frente a lista se monta sozinha a cada mês que fecha. */
var TERMO_INICIO = 202604;
var TERMO = { medida: 'n', meses: true, proj: true, tabela: false };
function ymLabel(ym) { var a = Math.floor(ym / 100), m = ym % 100; return MES_ABREV[m - 1] + '/' + String(a).slice(2); }
function ymShift(ym, n) { var a = Math.floor(ym / 100), m = ym % 100 - 1 + n; return (a + Math.floor(m / 12)) * 100 + (((m % 12) + 12) % 12) + 1; }
function diasNoMes(ym) { return new Date(Math.floor(ym / 100), ym % 100, 0).getDate(); }

/* Blocos da meta: o mês partido em checkpoints. 'd10' = decêndios (3 blocos
   num mês de 30), 'sem' = semanas corridas a partir do dia 1. */
var BLOCOS = { modo: 'sem' };                 // semana é o padrão (pedido do Ricardo, 08/09)
/* Faixas de um mês de `nDias` em blocos de `tam` dias. O rabo do mês entra no
   bloco anterior em vez de virar bloco próprio (ver "meta em blocos"). Usado
   pelo card da meta E pelo heatmap "Quando o Parque vende" — uma régua só. */
function faixasBlocos(nDias, tam) {
  var out = [], ini = 1, f;
  while (ini <= nDias) { f = Math.min(ini + tam - 1, nDias); out.push({ a: ini, b: f }); ini = f + 1; }
  if (out.length > 1) {
    var ult = out[out.length - 1];
    if (ult.b - ult.a + 1 < tam / 2) { out[out.length - 2].b = ult.b; out.pop(); }
  }
  return out;
}

/* ---- séries acumuladas: o termômetro e a projeção liam a MESMA coisa por
   dois caminhos diferentes, e foi assim que 90 e 70 acabaram na mesma tela
   sem ninguém conseguir dizer por quê. Agora as duas contas saem daqui. ---- */

/* acumulado dia a dia de um mês, sempre com 31 posições: mês de 30 repete o
   dia 30 na posição 31, senão a faixa despencaria no último dia por motivo
   de calendário, não de venda. `vale` diz o que somar — 1 por venda (contagem)
   ou o valor dela. */
function acumMes(V, ymX, vale) {
  var pd = {}, nd = diasNoMes(ymX), out = [], acc = 0, d, i;
  for (i = 0; i < V.length; i++) {
    if (V[i].ym !== ymX) continue;
    d = Number(String(V[i].data).slice(8, 10));
    if (d >= 1 && d <= 31) pd[d] = (pd[d] || 0) + vale(V[i]);
  }
  for (d = 1; d <= nd; d++) { acc += (pd[d] || 0); out.push(acc); }
  while (out.length < 31) out.push(out[out.length - 1]);
  return out;
}
function umaVenda() { return 1; }

/* meses de referência: completos, desde TERMO_INICIO, anteriores ao exibido.
   A lista se monta sozinha a cada mês que fecha. */
function mesesRef(V, ym) {
  var ys = [], i;
  for (i = 0; i < V.length; i++)
    if (V[i].ym >= TERMO_INICIO && V[i].ym < ym && ys.indexOf(V[i].ym) < 0) ys.push(V[i].ym);
  return ys.sort(function (a, b) { return a - b; });
}

function medianaDe(a) {
  if (!a.length) return 0;
  var s = a.slice().sort(function (x, y) { return x - y; }), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/* perfil: fração do total do mês já feita até cada dia, na mediana dos meses
   de referência — "no dia 15 costuma-se ter 42% do mês feito". É o que diz
   quanto do mês o dia de hoje já decidiu, e portanto quanta fé a projeção
   merece. */
function perfilMediano(acums) {
  var out = [], p;
  for (p = 0; p < 31; p++) out.push(medianaDe(acums.map(function (a) {
    var t = a[30]; return t > 0 ? a[p] / t : 0;
  })));
  return out;
}

/* tooltips compartilhados */
var tip = $('#tip');
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(function (n) {
    n.addEventListener('mousemove', function (e) {
      tip.innerHTML = n.dataset.tip; tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 250) + 'px';
      tip.style.top = (e.clientY + 14) + 'px';
    });
    n.addEventListener('mouseleave', function () { tip.style.opacity = 0; });
  });
}

/* SVG helpers */
function S(w, h) { var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 ' + w + ' ' + h); s.setAttribute('width', '100%'); return s; }
function N(t, a, p) { var n = document.createElementNS('http://www.w3.org/2000/svg', t); for (var k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; }
function T(x, y, s, c, an, p) { var t = N('text', { x: x, y: y, 'class': c, 'text-anchor': an || 'start' }, p); t.textContent = s; return t; }

function CORES() {
  var ps = document.body.classList.contains('emp-ps');
  var cs = getComputedStyle(document.body);
  return {
    accent: cs.getPropertyValue('--accent').trim(),
    blue: cs.getPropertyValue('--blue').trim(), mag: cs.getPropertyValue('--mag').trim(),
    gray: cs.getPropertyValue('--gray').trim(), grid: cs.getPropertyValue('--grid').trim(),
    axis: cs.getPropertyValue('--axis').trim(), card: '#121b2e',
    ink2: cs.getPropertyValue('--ink2').trim(), muted: cs.getPropertyValue('--muted').trim(),
    warn: cs.getPropertyValue('--warn').trim(), good: '#0ca30c', crit: '#d03b3b',
    // ramps ordinais/sequenciais na família da empresa
    ramp: ps ? ['#e3b13e', '#c08708', '#8f6405', '#5f4304'] : ['#5fc8da', '#14a3bc', '#0d7183', '#084c59'],
    heat: ps ? ['#182238', '#3d2e0c', '#6b4e08', '#997006', '#c08708'] : ['#182238', '#0c333c', '#0d5361', '#0f7d92', '#14a3bc']
  };
}

/* soma / agrupa */
function soma(arr, f) { var t = 0; arr.forEach(function (x) { t += (f ? (f(x) || 0) : (x || 0)); }); return t; }
function grupo(arr, f) { var m = {}; arr.forEach(function (x) { var k = f(x); (m[k] = m[k] || []).push(x); }); return m; }

/* barra 100% empilhada + legenda com contagens — o desenho padrão das quebras */
function quebraCard(cont, itens, tot, unidade, paleta) {
  var C = CORES();
  /* pares validados p/ daltonismo: PS = dourado+azul+magenta · EU = ciano+magenta+azul */
  var ps = document.body.classList.contains('emp-ps');
  /* `paleta` (19/09/26) é opcional e existe para quando a cor CARREGA
     significado que a ordem não carrega: a natureza do recebimento (à vista ·
     cartão · carnê) e a rampa do prazo, na aba Como o cliente paga. Sem ela,
     nada muda para quem já chamava com quatro argumentos. */
  var cores = paleta && paleta.length ? paleta
            : (ps ? [C.accent, C.blue, C.mag, C.gray] : [C.accent, C.mag, C.blue, C.gray]);
  var w = 320, h = 34 + itens.length * 24, svg = S(w, h);
  var x = 0;
  itens.forEach(function (o, i) {
    var bw = tot ? (o.v / tot) * (w - 4) : 0;
    var r = N('rect', { x: x, y: 6, width: Math.max(bw - 2, 2), height: 20, rx: 4, fill: cores[Math.min(i, cores.length - 1)] }, svg);
    r.dataset.tip = '<b>' + esc(o.n) + ': ' + fN(o.v) + ' ' + unidade + '</b><br><span>' + fPct(tot ? o.v / tot * 100 : 0, 0) + '</span>';
    x += bw;
  });
  itens.forEach(function (o, i) {
    var yy = 52 + i * 24;
    N('rect', { x: 0, y: yy - 8, width: 9, height: 9, rx: 3, fill: cores[Math.min(i, cores.length - 1)] }, svg);
    T(16, yy, o.n, 'lab-t', 'start', svg);
    T(w - 40, yy, fN(o.v), 'val-t', 'end', svg);
    T(w, yy, fPct(tot ? o.v / tot * 100 : 0, 0), 'axis-t', 'end', svg);
  });
  cont.appendChild(svg); bindTips(svg);
}

/* top-N + Outros a partir de um grupo {chave:[itens]} */
function topN(m, n, peso) {
  var itens = Object.keys(m).map(function (k) { return { n: k, v: peso ? soma(m[k], peso) : m[k].length }; });
  itens.sort(function (a, b) { return b.v - a.v; });
  if (itens.length > n) {
    var resto = itens.slice(n - 1);
    itens = itens.slice(0, n - 1);
    itens.push({ n: 'Outros', v: soma(resto, function (x) { return x.v; }) });
  }
  return itens;
}

/* QUAL VISTA ESTA PAGINA DESENHA (19/09/2026).
   A mesma página serve duas abas do Painel: o Executivo (padrão) e a Receita
   Contratada (`?vista=receita`), que mostra só "Como o cliente paga". Uma
   página, dois recortes — os helpers de gráfico, as cores e o dado do Cofre
   são os mesmos, e nada foi duplicado para a aba nova. */
var VISTA = (function () {
  try { return new URLSearchParams(location.search).get('vista') || ''; }
  catch (e) { return ''; }
})();

/* ============================================================ PS: render */
window.__renderPS = function (dados, ymSel) {
  var C = CORES();
  /* A vista "receita" sai aqui, antes de tudo: a tela do Executivo inteira
     custaria uma montagem que ninguém veria. O mês continua vindo dos chips
     do pai, porque o momento da venda, o mix, o prazo e o vendedor seguem o
     mês — o recebimento e o programado é que não seguem. */
  if (VISTA === 'receita') {
    var gR = $('#gridPS'); gR.innerHTML = '';
    var mesesR = (dados && dados.meses) || [];
    var ymR = ymSel || (mesesR.length ? mesesR[0].ym : null);
    if (!dados || !dados.como_paga) {
      gR.appendChild(el('<div class="card s12"><h3>Receita contratada</h3><div class="vazio">' +
        'O Cofre ainda não devolveu o pacote desta tela.</div></div>'));
      return;
    }
    secaoComoPaga(gR, dados, ymR);
    bindTips(gR);
    return;
  }
  var g = $('#gridPS'); g.innerHTML = '';
  if (!dados || !dados.vendas || !dados.vendas.length) {
    g.appendChild(el('<div class="card s12"><h3>Parque da Saudade</h3><div class="vazio">' +
      esc((dados && dados.erro) || 'A rota do Parque não devolveu vendas.') + '</div></div>'));
    return;
  }
  var V = dados.vendas;
  var meses = dados.meses || [];
  var ym = ymSel || (meses.length ? meses[0].ym : null);
  var am = String(Math.floor(ym / 100)) + '-' + ('0' + (ym % 100)).slice(-2);
  var meta = (dados.metas && dados.metas[am]) || { oficial: null, desafio: null, vendedor: {} };
  var metaOf = meta.oficial;

  var doMes = V.filter(function (v) { return v.ym === ym; });
  var ymAnt = meses.length > 1 ? (meses[meses.findIndex(function (m) { return m.ym === ym; }) + 1] || {}).ym : null;
  var doAnt = ymAnt ? V.filter(function (v) { return v.ym === ymAnt; }) : [];

  /* o "hoje" da conta é a data da última venda registrada OU o dia real,
     o que for maior — mês fechado projeta nada */
  var hoje = new Date();
  var ymHoje = hoje.getFullYear() * 100 + (hoje.getMonth() + 1);
  var nDias = diasNoMes(ym);
  var mesCorrente = (ym === ymHoje);
  var diaRef = mesCorrente ? hoje.getDate() : nDias;
  var redesenharHeat = null;                            // preenchido pelo heatmap, chamado pelo botão dos blocos

  var porDia = {}; doMes.forEach(function (v) { var d = Number(String(v.data).slice(8, 10)); porDia[d] = (porDia[d] || 0) + 1; });
  var acum = [], t = 0;
  for (var d = 1; d <= nDias; d++) { t += (porDia[d] || 0); acum.push(t); }
  var total = doMes.length;

  var vgvMes = soma(doMes, function (v) { return v.venda; });

  /* ===== A BASE DO TICKET MÉDIO E DO DESCONTO NÃO É O MÊS INTEIRO (11/09/26)
     Pedido do Ricardo, e a medição deu razão a ele antes de uma linha ser
     escrita. Duas coisas entravam na conta e não são preço negociado:

     · TEMPORÁRIO. Ele sai por 20% da tabela — 80% de "desconto" que é PREÇO
       DE TABELA, não concessão de ninguém. Em set/26 o card mostrava 9,6% de
       desconto médio com TRÊS vendas temporárias dentro; sem elas o desconto
       real do mês é 0,3%. Os nove pontos eram a tabela do temporário
       disfarçada de vendedor dando desconto.
     · DOAÇÃO. Jazigo perpétuo que sai por R$ 0,01 (dois casos: M-19-063 em
       ago/26, M-19-067 em mai/26). Vira 100% de desconto e um ticket de um
       centavo na média.

     O CORTE DA DOAÇÃO É POR VALOR, e não por razão ou por percentual de
     desconto, por decisão do Ricardo em 11/09: a razão do temporário JÁ ANDOU
     uma vez (0,300 em julho, 0,200 de agosto em diante) e qualquer limiar de
     razão volta a errar sozinho na próxima mexida de tabela. R$ 100 não anda.

     ⛔ O QUE NÃO MUDA, e é de propósito: o VGV do mês e a CONTAGEM de vendas
     seguem com tudo dentro. O dinheiro entrou e a venda aconteceu — quem
     precisa de base limpa é a MÉDIA, porque média é o único número aqui que
     um caso extremo consegue mover sozinho.

     ⚠️ E perpétuo com desconto grande de verdade FICA (M-19-251, jul/26, 70%
     de desconto com tabela Perpétuo). Concessão grande é exatamente o que
     este KPI existe para mostrar; tirá-la seria esconder o que se quer medir.
     ================================================================== */
  var DOACAO_ATE = 100;   // R$ — abaixo disso não é venda, é doação/permuta
  var ehDoacao = function (v) { return Number(v.venda || 0) <= DOACAO_ATE; };
  var ehTemp = function (v) { return v.modalidade === 'Temporário'; };

  var baseTM = doMes.filter(function (v) { return !ehTemp(v) && !ehDoacao(v); });
  var nTemp = doMes.filter(ehTemp).length;
  var nDoacao = doMes.filter(function (v) { return !ehTemp(v) && ehDoacao(v); }).length;

  var vgvBase = soma(baseTM, function (v) { return v.venda; });
  var tm = baseTM.length ? vgvBase / baseTM.length : 0;
  var faceMes = soma(baseTM, function (v) { return v.face; });
  var descPond = faceMes > 0 ? (1 - vgvBase / faceMes) * 100 : null; // %

  /* A linha que diz de onde saiu o número. Card que muda de base sem avisar é
     card que vira pergunta em reunião — e a resposta certa ("tiramos o
     temporário") chega tarde demais para valer alguma coisa. */
  var notaBase = (function () {
    var fora = [];
    if (nTemp) fora.push(fN(nTemp) + ' temporári' + (nTemp > 1 ? 'as' : 'a'));
    if (nDoacao) fora.push(fN(nDoacao) + ' doaç' + (nDoacao > 1 ? 'ões' : 'ão'));
    if (!fora.length) return 'sobre as ' + fN(baseTM.length) + ' vendas do mês';
    return 'sobre ' + fN(baseTM.length) + ' de ' + fN(total) + ' vendas · fora: ' +
      fora.join(' e ') + ' (preço de tabela, não desconto concedido)';
  })();
  var vgvAntMesmoDia = soma(doAnt.filter(function (v) { return Number(String(v.data).slice(8, 10)) <= diaRef; }), function (v) { return v.venda; });

  /* ================== ritmos e projeção — só no mês corrente ==============
     Até 02/09 este bloco produzia UM número (`prov`) e uma faixa que, do dia 1
     ao 14, era garantidamente um PONTO: `d14ini` vale 1 enquanto diaRef<=14, e
     aí o "ritmo dos últimos 14 dias" É o ritmo do mês — piso === teto === prov.
     O cone exibia certeza exatamente quando a incerteza é máxima. Pior: o
     Termômetro, no card ao lado, projetava o mesmo fechamento por OUTRO método
     e mostrava outro número, sem que nada na tela dissesse que eram dois
     métodos. Em 02/09 a tela deu 90 aqui e 70 lá, com 6 vendas em 2 dias.

     Agora: o número grande é o RITMO CORRIDO (o que há hoje, mantida a média
     até o fim do mês) · a faixa é o espalhamento dos métodos disponíveis, e
     por isso só colapsa quando eles concordam de verdade · e o card diz quanto
     do mês o dia de hoje costuma decidir, que é a medida honesta de quanta fé
     a projeção merece.
     -------------------------------------------------------------------- */
  var acumAtual = acumMes(V, ym, umaVenda);
  var totalAteHoje = acumAtual[Math.min(diaRef, nDias) - 1] || 0;
  var adiantadas = total - totalAteHoje;   /* venda datada à frente de hoje */

  var ritmoMes = diaRef > 0 ? totalAteHoje / diaRef : 0;
  var d14ini = Math.max(1, diaRef - 13), n14 = 0;
  for (var dd = d14ini; dd <= diaRef; dd++) n14 += (porDia[dd] || 0);
  var ritmo14 = n14 / Math.max(1, diaRef - d14ini + 1);
  var restam = nDias - diaRef;

  var refYms = mesesRef(V, ym);
  var refAcum = refYms.map(function (y) { return acumMes(V, y, umaVenda); });
  var refLab = refYms.length ? ymLabel(refYms[0]) + '–' + ymLabel(refYms[refYms.length - 1]) : '';
  var refFech = refAcum.map(function (a) { return a[30]; });
  var perfilN = refAcum.length ? perfilMediano(refAcum) : null;
  var fracDia = perfilN ? perfilN[Math.min(diaRef, nDias) - 1] : null;

  /* (1) ritmo corrido — a média de hoje mantida até o fim do mês */
  var projCorrido = mesCorrente ? Math.round(totalAteHoje + ritmoMes * restam) : null;
  /* (2) ritmo dos últimos 14 dias — só existe depois do dia 14; antes disso
         ele é, por construção, o mesmo número do (1), e entrar na faixa como
         se fosse método independente é o que fabricava a falsa precisão */
  var proj14 = (mesCorrente && diaRef > 14) ? Math.round(totalAteHoje + ritmo14 * restam) : null;
  /* (3) curva histórica — o mesmo acumulado, se o resto do mês seguir o perfil
         mediano dos meses de referência. É a conta do Termômetro. */
  var projHist = (mesCorrente && fracDia > 0 && totalAteHoje > 0) ? Math.round(totalAteHoje / fracDia) : null;

  var cand = [];
  if (projCorrido !== null) cand.push(projCorrido);
  if (proj14 !== null) cand.push(proj14);
  if (projHist !== null) cand.push(projHist);
  var prov = projCorrido;
  var piso = cand.length ? Math.min.apply(null, cand) : null;
  var teto = cand.length ? Math.max.apply(null, cand) : null;

  var esperado = metaOf ? metaOf * diaRef / nDias : null;
  var necessario = (metaOf && restam > 0) ? Math.max(0, metaOf - total) / restam : null;

  /* quanta fé a projeção merece = quanto do mês costuma estar decidido aqui.
     Sem histórico, cai no calendário puro (dia ÷ dias do mês). */
  var fracFe = fracDia != null ? fracDia : diaRef / nDias;
  var confN = fracFe >= .6 ? 'good' : (fracFe >= .25 ? 'warn' : 'crit');
  var confTxt = { good: '● projeção firme', warn: '▲ projeção ainda mole',
                  crit: '● cedo demais — trate como palpite' }[confN];

  var stMes = 'good';
  if (metaOf && esperado) stMes = total >= esperado ? 'good' : (total >= esperado * 0.7 ? 'warn' : 'crit');
  var stTxt = { good: '● no ritmo da meta', warn: '▲ atenção — abaixo do ritmo', crit: '● bem abaixo do ritmo' }[stMes];

  /* -------- vendas de hoje: quantas e de quem --------
     Agrupa por vendedor e mostra Nome (n). Sem venda hoje, o bloco diz isso —
     não cai para o último dia com venda, porque "3 vendas" sem data ao lado já
     foi lido como sendo de hoje mais de uma vez. Em mês fechado não aparece. */
  var hojeHTML = '';
  if (mesCorrente) {
    var dHoje = hoje.getDate();
    var vHoje = doMes.filter(function (v) { return Number(String(v.data).slice(8, 10)) === dHoje; });
    var lbHoje = 'Hoje · ' + ('0' + dHoje).slice(-2) + '/' + MES_ABREV[hoje.getMonth()];
    if (vHoje.length) {
      var porVend = grupo(vHoje, function (v) { return v.vendedor || 'sem vendedor'; });
      var nmHoje = Object.keys(porVend).map(function (n) { return { n: n, v: porVend[n].length }; })
        .sort(function (a, b) { return b.v - a.v || a.n.localeCompare(b.n); })
        .map(function (o) { return '<b>' + esc(o.n) + '</b> (' + o.v + ')'; }).join(' · ');
      hojeHTML = '<div class="hoje"><div class="lb">' + esc(lbHoje) + '</div>' +
        '<div class="n">' + fN(vHoje.length) + ' <small>jazigo' + (vHoje.length > 1 ? 's' : '') + '</small></div>' +
        '<div class="nomes">' + nmHoje + '</div></div>';
    } else {
      hojeHTML = '<div class="hoje"><div class="lb">' + esc(lbHoje) + '</div>' +
        '<div class="vazio">sem venda registrada até agora</div></div>';
    }
  }

  /* -------- quinzenas: 1ª | 2ª --------
     Pedido do Ricardo em 07/09: vai no rodapé do card "Quando o Parque vende",
     que tinha espaço vazio. Fatia de cada quinzena no mês selecionado, no anterior e na média
     dos até 6 meses anteriores, e a quinzena em curso comparada com o mesmo
     dia do mês anterior. Quinzena = dia ≤ 15 / dia ≥ 16. */
  var quinzHTML = (function () {
    function diaDe(v) { return Number(String(v.data).slice(8, 10)); }
    function q(arr) { var a = 0, b = 0; arr.forEach(function (v) { if (diaDe(v) <= 15) a++; else b++; }); return { a: a, b: b, t: a + b }; }
    function barra(rot, o, obs) {
      var pa = o.t ? o.a / o.t * 100 : 0, pb = o.t ? o.b / o.t * 100 : 0;
      return '<div class="qz"><div class="rot">' + esc(rot) + (obs ? '<small>' + esc(obs) + '</small>' : '') + '</div>' +
        '<div class="bar"><span style="width:' + pa.toFixed(1) + '%"></span><span class="b" style="width:' + pb.toFixed(1) + '%"></span></div>' +
        '<div class="num"><b>' + fN(o.a) + '</b> · ' + fPct(pa, 0) + '<i>|</i><b>' + fN(o.b) + '</b> · ' + fPct(pb, 0) + '</div></div>';
    }
    var qm = q(doMes), na1 = mesCorrente && diaRef <= 15;
    var out = '<div class="hoje quinz"><div class="lb">Quinzenas · 1ª | 2ª</div>';
    out += barra(ymLabel(ym), qm, mesCorrente ? ('até dia ' + diaRef) : '');
    if (ymAnt) out += barra(ymLabel(ymAnt), q(doAnt), '');
    var hist = { a: 0, b: 0, t: 0 }, nH = 0;
    for (var i = 1; i <= 6; i++) {
      var yH = ymShift(ym, -i), arrH = V.filter(function (v) { return v.ym === yH; });
      if (!arrH.length) continue;
      var oH = q(arrH); hist.a += oH.a; hist.b += oH.b; hist.t += oH.t; nH++;
    }
    if (nH > 1) out += barra('média ' + nH + ' meses', hist, '');
    if (mesCorrente && ymAnt) {
      var agora = na1 ? qm.a : qm.b;
      var antMesmoDia = doAnt.filter(function (v) { var d = diaDe(v); return d <= diaRef && (na1 ? d <= 15 : d >= 16); }).length;
      out += '<div class="why" style="margin:8px 0 0">' + (na1 ? '1ª' : '2ª') + ' quinzena até o dia ' + diaRef + ': <b>' + fN(agora) + '</b> × ' +
        fN(antMesmoDia) + ' em ' + esc(ymLabel(ymAnt)) + ' no mesmo dia' +
        (antMesmoDia ? ' (<b>' + (agora >= antMesmoDia ? '+' : '') + fN((agora / antMesmoDia - 1) * 100, 0) + '%</b>)' : '') + '.</div>';
    }
    return out + '</div>';
  })();

  /* -------- hero + projeção + tiles -------- */
  g.appendChild(el(
    '<div class="card hero s4"><h3>Vendas de ' + esc(ymLabel(ym)) + '</h3>' +
    '<div class="why">jazigos vendidos' + (metaOf ? ' · meta oficial ' + metaOf + (meta.desafio ? ' · desafio ' + meta.desafio : '') : ' · sem meta na Config') + '</div>' +
    '<div class="val">' + fN(total) + (metaOf ? ' <small>/ ' + metaOf + '</small>' : '') + '</div>' +
    '<div id="psGauge"></div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:6px">' +
    (metaOf ? '<span class="statuschip ' + stMes + '">' + stTxt + '</span>' : '<span class="vazio">defina a meta na Config do Cofre</span>') +
    (esperado && mesCorrente ? '<span style="font-size:11.5px;color:var(--muted)">esperado até hoje: <b style="color:var(--ink2)">' + fN(esperado, 0) + '</b></span>' : '') +
    '</div>' + hojeHTML + '</div>'));

  g.appendChild(el(
    '<div class="card s4"><h3>Projeção de fechamento</h3>' +
    '<div class="why">' + (mesCorrente
      ? 'ritmo corrido: as ' + fN(totalAteHoje) + ' vendas até o dia ' + diaRef + ', mantida a média até o dia ' + nDias
      : 'mês fechado — sem projeção') + '</div>' +
    (mesCorrente
      ? '<div class="tile"><div class="val">' + fN(prov) + ' <small>jazigos</small></div>' +
        '<div class="delta flat">' + fN(ritmoMes, 1) + ' vendas/dia' +
        (piso !== teto ? ' · faixa <b style="color:var(--ink)">' + fN(piso) + '</b>–<b style="color:var(--ink)">' + fN(teto) + '</b>' : '') +
        (metaOf ? ' <span class="vs">· meta ' + metaOf + '</span>' : '') + '</div></div><div id="psCone"></div>' +
        '<div style="margin-top:10px"><span class="statuschip ' + confN + '">' + confTxt + '</span></div>' +
        '<div class="why" style="margin:8px 0 0">Dia ' + diaRef + ' de ' + nDias + '.' +
          (fracDia != null
            ? ' Nesta altura ' + esc(refLab) + ' tinham <b>' + fPct(fracDia * 100, 0) + '</b> do mês feito' +
              (refFech.length ? ', e fecharam entre <b>' + fN(Math.min.apply(null, refFech)) +
               '</b> e <b>' + fN(Math.max.apply(null, refFech)) + '</b>' : '') + '.'
            : '') +
          ' <b>Quanto mais dias passam, mais a projeção encosta na tendência real</b> — hoje ela se apoia em ' +
          fN(diaRef) + ' dia' + (diaRef > 1 ? 's' : '') + '.</div>' +
        (projHist !== null && projHist !== prov
          ? '<div style="font-size:11.5px;color:var(--ink2);margin-top:8px">Pela <b style="color:var(--ink)">curva histórica</b> daria <b style="color:var(--ink)">' +
            fN(projHist) + '</b> — o mesmo acumulado, se o resto do mês seguir o perfil mediano de ' + esc(refLab) +
            '. É o número que o Termômetro projeta ao lado: outra conta, não outra verdade.</div>' : '') +
        (necessario !== null ? '<div style="font-size:11.5px;color:var(--ink2);margin-top:8px">Para bater a meta: <b style="color:var(--ink)">' +
          fN(necessario, 1) + ' vendas/dia</b> — ritmo do mês: ' + fN(ritmoMes, 1) + '</div>' : '') +
        (adiantadas > 0 ? '<div style="font-size:11.5px;color:var(--warn);margin-top:8px">⚠ ' + fN(adiantadas) +
          ' venda(s) do mês com data à frente do dia ' + diaRef + ' — fora da conta do ritmo.</div>' : '')
      : '<div class="tile"><div class="val">' + fN(total) + ' <small>jazigos</small></div>' +
        '<div class="delta flat">resultado final do mês' + (metaOf ? ' · ' + fPct(total / metaOf * 100, 0) + ' da meta' : '') + '</div></div>') +
    '</div>'));

  g.appendChild(el(
    '<div class="s4" style="display:grid;gap:14px">' +
    '<div class="card tile"><h3>VGV do mês</h3><div class="val">' + fBRL(vgvMes) + '</div>' +
    (ymAnt ? '<div class="delta ' + (vgvMes >= vgvAntMesmoDia ? 'up' : 'down') + '">' +
      (vgvAntMesmoDia > 0 ? ((vgvMes >= vgvAntMesmoDia ? '▲ ' : '▼ ') + fPct(Math.abs(vgvMes / vgvAntMesmoDia - 1) * 100, 0)) : '—') +
      ' <span class="vs">vs ' + esc(ymLabel(ymAnt)) + (mesCorrente ? ' (mesmo dia)' : '') + '</span></div>' : '') + '</div>' +
    '<div class="card tile"><h3>Ticket médio · Desconto</h3>' +
    '<div class="why" style="margin:-2px 0 10px">só perpétuo, sem doação</div>' +
    '<div style="display:flex;gap:26px;align-items:baseline;flex-wrap:wrap">' +
    '<div><div class="val" style="font-size:26px">' + fBRL(tm) + '</div><div class="delta flat">ticket médio</div></div>' +
    '<div><div class="val" style="font-size:26px">' + (descPond === null ? '–' : fN(descPond, 1) + '<small>%</small>') + '</div>' +
    '<div class="delta flat">desconto pond. <span class="vs">(face × venda)</span></div></div></div>' +
    '<div class="why" style="margin:10px 0 0">' + esc(notaBase) + '</div></div></div>'));

  /* -------- ritmo -------- */
  g.appendChild(el('<div class="sect"><h2>Ritmo do mês</h2><div class="ln"></div><span class="tag">calculado da aba Vendas do Cofre</span></div>'));

  var cCurva = el('<div class="card s8"><h3>Termômetro do mês — ' + esc(ymLabel(ym)) + '</h3>' +
    '<div class="why">acumulado dia a dia contra o território conhecido: onde a operação já esteve neste mesmo dia. ' +
    'A projeção aplica o perfil mediano ao acumulado de hoje — não é meta, e pode ser desligada.</div>' +
    '<div class="termobar">' +
      '<div class="seg" role="group" aria-label="Medida">' +
        '<button id="tmN" type="button" aria-selected="true">Vendas</button>' +
        '<button id="tmV" type="button" aria-selected="false">Valor</button></div>' +
      '<label class="chk"><input type="checkbox" id="tm_meses"> meses</label>' +
      '<label class="chk"><input type="checkbox" id="tm_proj"> projeção</label>' +
      '<label class="chk"><input type="checkbox" id="tm_tabela"> tabela</label>' +
    '</div>' +
    '<div id="psCurva"></div><div class="legend" id="psTermoLeg"></div>' +
    '<div class="why" id="psTermoCap" style="margin:10px 0 0"></div>' +
    '<div id="psTermoTab"></div></div>');
  g.appendChild(cCurva);

  var cHeat = el('<div class="card s4"><h3>Quando o Parque vende</h3><div class="why">vendas por dia do mês — últimos 6 meses · traço = fronteira dos blocos da meta</div><div id="psHeat"></div><div id="psHeatNota" style="font-size:11.5px;color:var(--ink2);margin-top:10px"></div>' + quinzHTML + '</div>');
  g.appendChild(cHeat);

  var cMeses = el('<div class="card s4"><h3>Meses — realizado × meta</h3><div class="why">últimos 4 meses' + (mesCorrente ? ' (atual em curso + projeção)' : '') + '</div><div id="psMeses"></div></div>');
  g.appendChild(cMeses);

  var cPlacar = el('<div class="card s8"><h3>Placar por vendedor</h3><div class="why">risca cheia = esperado até hoje · tracejada = meta individual (Config)</div><table class="placar" id="psPlacar"></table></div>');
  g.appendChild(cPlacar);

  /* -------- meta em blocos --------
     Pedido do Ricardo em 02/09: a meta do mês quebrada em checkpoints, para
     ninguém descobrir no dia 28 que o mês já era. Até 07/09 a meta de cada
     bloco era proporcional aos dias dele (set/26 em semanas dava 21+21+21+27,
     porque o rabo de 2 dias funde na última). Em 08/09 o Ricardo pediu POR
     IGUAL: meta ÷ número de blocos, inteiro, e a sobra vai para os PRIMEIROS
     blocos — 90 em 4 semanas = 23+23+22+22. Os blocos seguem somando
     exatamente a meta. */
  var cBlocos = el('<div class="card s12"><h3>Meta em blocos — ' + esc(ymLabel(ym)) + '</h3>' +
    '<div class="why">a meta do mês partida em checkpoints · meta do bloco = meta ÷ número de blocos, por igual (a sobra vai para os primeiros), e por isso os blocos somam a meta cheia</div>' +
    '<div class="termobar"><div class="seg" role="group" aria-label="Tamanho do bloco">' +
      '<button id="blD" type="button">10 dias</button>' +
      '<button id="blS" type="button">semana</button></div></div>' +
    '<div id="psBlocos"></div></div>');
  g.appendChild(cBlocos);

  /* -------- mix -------- */
  g.appendChild(el('<div class="sect"><h2>Mix da venda — ' + esc(ymLabel(ym)) + '</h2><div class="ln"></div><span class="tag">canal · modalidade · pagamento</span></div>'));
  var cCanal = el('<div class="card s4"><h3>Canal de venda</h3><div class="why">participação nas ' + fN(total) + ' vendas do mês</div><div id="psCanal"></div></div>');
  var cModal = el('<div class="card s4"><h3>Modalidade</h3><div class="why">uso perpétuo × temporário · a modalidade vem do nome da tabela de vendas do CRM</div><div id="psModal"></div></div>');
  var cPag = el('<div class="card s4"><h3>Pagamento</h3><div class="why">condição e forma</div><div id="psCond"></div><div id="psForma" style="margin-top:6px"></div></div>');
  g.appendChild(cCanal); g.appendChild(cModal); g.appendChild(cPag);

  /* -------- FAROL (aguarda origem) -------- */
  g.appendChild(el('<div class="sect"><h2>Farol — previsibilidade</h2><div class="ln"></div><span class="lockchip">🔒 liga quando a Origem do Lead chegar ao Cofre</span></div>'));
  g.appendChild(el('<div class="card s4 lock"><h3>Funil do mês</h3><div class="why">leads → visita → proposta → venda (Facilita)</div>' +
    '<div class="body" id="psFunil"></div><div class="need">depende: coletor Facilita → Cofre</div></div>'));
  g.appendChild(el('<div class="card s4 lock"><h3>Custo por venda, por canal</h3><div class="why">CPL · CAC · ROAS</div>' +
    '<div class="body" id="psCac"></div><div class="need">depende: campo Origem + planilha de gastos</div></div>'));
  g.appendChild(el('<div class="card s4 lock"><h3>Previsão 90 dias</h3><div class="why">piso · provável · teto — pipeline × conversão histórica</div>' +
    '<div class="body"><div class="tile"><div class="val">—</div><div class="delta flat">pipeline × conversão histórica</div></div></div>' +
    '<div class="need">depende: funil + 3 meses de histórico de origem</div></div>'));

  /* ================= desenhos ================= */

  /* gauge */
  (function () {
    if (!metaOf) return;
    var w = 300, h = 86, svg = S(w, h), cx = w / 2, cy = 78, r = 64;
    var arc = function (a0, a1, rr) {
      var p = function (a) { return [cx + rr * Math.cos(Math.PI * (1 - a)), cy - rr * Math.sin(Math.PI * (1 - a))]; };
      var q0 = p(a0), q1 = p(a1);
      return 'M' + q0[0] + ' ' + q0[1] + ' A' + rr + ' ' + rr + ' 0 0 1 ' + q1[0] + ' ' + q1[1];
    };
    N('path', { d: arc(0, 1, r - 5.5), stroke: '#1c2740', 'stroke-width': 11, fill: 'none' }, svg);
    var fr = Math.min(1, total / metaOf);
    var p1 = N('path', { d: arc(0, Math.max(fr, .01), r - 5.5), stroke: C.accent, 'stroke-width': 11, fill: 'none' }, svg);
    p1.dataset.tip = '<b>' + fN(total) + ' vendidos</b> <span>· ' + fPct(total / metaOf * 100, 0) + ' da meta</span>';
    if (esperado && mesCorrente) {
      var am2 = Math.min(1, esperado / metaOf);
      var mx = cx + (r + 2) * Math.cos(Math.PI * (1 - am2)), my = cy - (r + 2) * Math.sin(Math.PI * (1 - am2));
      var mx2 = cx + (r - 14) * Math.cos(Math.PI * (1 - am2)), my2 = cy - (r - 14) * Math.sin(Math.PI * (1 - am2));
      N('line', { x1: mx, y1: my, x2: mx2, y2: my2, stroke: C.ink2, 'stroke-width': 2 }, svg);
      T(mx2 - 4, my2 + 2, 'ideal ' + fN(esperado, 0), 'axis-t', 'end', svg);
    }
    T(cx - r, h - 2, '0', 'axis-t', 'start', svg); T(cx + r, h - 2, String(metaOf), 'axis-t', 'end', svg);
    T(cx, cy - 8, fPct(total / metaOf * 100, 0), 'gauge-pct', 'middle', svg);   // resultado × meta, dentro do arco (pedido de 07/09)
    $('#psGauge').appendChild(svg); bindTips(svg);
  })();

  /* cone de projeção — a barriga só existe quando os métodos discordam.
     Quando piso === teto não há faixa nenhuma para desenhar, e desenhar um
     triângulo de altura zero com dois rótulos iguais é o que fazia a tela
     parecer precisa no dia 2. */
  (function () {
    if (!mesCorrente || prov === null) return;
    var w = 300, h = 62, svg = S(w, h), x0 = 8, x1 = w - 40;
    var faixa = piso !== teto;
    var topo = Math.max(teto || 0, metaOf || 0, totalAteHoje) || 1;
    var y = function (v) { return 50 - (v / topo) * 40; };
    var xh = x0 + (diaRef / nDias) * (x1 - x0);
    if (faixa) N('path', { d: 'M' + xh + ' ' + y(totalAteHoje) + ' L' + x1 + ' ' + y(teto) + ' L' + x1 + ' ' + y(piso) + ' Z', fill: C.accent, opacity: .14 }, svg);
    N('line', { x1: x0, y1: y(0), x2: x1, y2: y(0), stroke: C.axis }, svg);
    N('path', { d: 'M' + x0 + ' ' + y(0) + ' L' + xh + ' ' + y(totalAteHoje), stroke: C.accent, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }, svg);
    N('path', { d: 'M' + xh + ' ' + y(totalAteHoje) + ' L' + x1 + ' ' + y(prov), stroke: C.accent, 'stroke-width': 2, 'stroke-dasharray': '1 5', 'stroke-linecap': 'round', fill: 'none' }, svg);
    N('circle', { cx: xh, cy: y(totalAteHoje), r: 4, fill: C.accent, stroke: C.card, 'stroke-width': 2 }, svg);
    T(x1 + 4, y(prov) + 3, fN(prov), 'val-t', 'start', svg);
    if (faixa) {
      T(x1 + 4, y(teto) + 1, fN(teto), 'axis-t', 'start', svg);
      T(x1 + 4, y(piso) + 9, fN(piso), 'axis-t', 'start', svg);
    }
    T(x0, h - 2, '1/' + ymLabel(ym).split('/')[0], 'axis-t', 'start', svg); T(x1, h - 2, String(nDias), 'axis-t', 'end', svg);
    $('#psCone').appendChild(svg);
  })();

  /* ================= meta em blocos =================
     Três decêndios ou cinco semanas, conforme o botão. O bloco em curso é
     comparado contra a fatia dele que já passou, não contra a meta inteira —
     cobrar 30 no dia 2 do decêndio seria mentir para o vendedor do mesmo jeito
     que projetar 90 no dia 2 do mês mentia para a gestão. */
  (function () {
    var alvo = $('#psBlocos');
    if (!alvo) return;

    /* o rabo do mês entra no bloco anterior em vez de virar bloco próprio:
       um mês de 31 dias em decêndios geraria um "dias 31–31" com meta 3, e um
       mês de 30 em semanas, um "dias 29–30" com meta 6 — checkpoint que ninguém
       consegue cumprir nem interpretar. Com a fusão, set/26 dá exatamente as 4
       semanas que o Ricardo tinha em mente. */
    function faixas(tam) { return faixasBlocos(nDias, tam); }

    function desenhar() {
      var bs = faixas(BLOCOS.modo === 'sem' ? 7 : 10), feitoAte = 0, metaAte = 0;

      var base = metaOf ? Math.floor(metaOf / bs.length) : null, sobra = metaOf ? metaOf - base * bs.length : 0;
      bs.forEach(function (b, k) {
        b.meta = (base === null) ? null : base + (k < sobra ? 1 : 0);   // por igual; sobra nos primeiros blocos
        b.feito = 0;
        for (var d = b.a; d <= b.b; d++) b.feito += (porDia[d] || 0);
        b.dias = b.b - b.a + 1;
        b.estado = !mesCorrente ? 'fechado'
          : (b.b < diaRef ? 'fechado' : (b.a <= diaRef ? 'curso' : 'futuro'));
        if (b.estado !== 'futuro') {
          feitoAte += b.feito;
          if (b.meta !== null) {
            var diasCorridos = b.estado === 'curso' ? (diaRef - b.a + 1) : b.dias;
            metaAte += b.meta * diasCorridos / b.dias;
          }
        }
      });

      var html = '<div class="blocos">';
      bs.forEach(function (b) {
        var per = 'dias ' + b.a + '–' + b.b;
        var st = '', cls = '', larg = 0;
        if (b.meta === null) {
          st = b.estado === 'futuro' ? 'a fazer' : (b.feito === 1 ? '1 venda' : fN(b.feito) + ' vendas');
        } else if (b.estado === 'fechado') {
          larg = Math.min(100, b.meta > 0 ? b.feito / b.meta * 100 : 100);
          cls = b.feito >= b.meta ? 'ok' : 'ruim';
          st = b.feito >= b.meta ? '✔ bateu' + (b.feito > b.meta ? ' (+' + fN(b.feito - b.meta) + ')' : '')
                                 : '✖ faltaram ' + fN(b.meta - b.feito);
        } else if (b.estado === 'curso') {
          var corridos = diaRef - b.a + 1, faltamD = b.b - diaRef;
          var esp = b.meta * corridos / b.dias;
          larg = Math.min(100, b.meta > 0 ? b.feito / b.meta * 100 : 0);
          cls = b.feito >= esp ? 'ok' : '';
          st = (b.feito >= esp ? '● no ritmo do bloco' : '▲ abaixo — esperado ' + fN(esp, 0) + ' no dia ' + diaRef) +
               (faltamD > 0 ? ' · faltam ' + fN(Math.max(0, b.meta - b.feito)) + ' em ' + faltamD + ' dia' + (faltamD > 1 ? 's' : '') : '');
        } else {
          st = 'a fazer';
        }
        html += '<div class="bloco ' + b.estado + '">' +
          '<div class="per">' + per + (b.estado === 'curso' ? ' · em curso' : '') + '</div>' +
          '<div class="n">' + fN(b.feito) + (b.meta === null ? '' : ' <small>/ ' + fN(b.meta) + '</small>') + '</div>' +
          (b.meta === null ? '' : '<div class="bar"><i class="' + cls + '" style="width:' + larg.toFixed(1) + '%"></i></div>') +
          '<div class="st">' + st + '</div></div>';
      });
      html += '</div>';

      if (!metaOf) {
        html += '<div class="why" style="margin:11px 0 0">' + esc(ymLabel(ym)) +
          ' está <b>sem meta oficial</b> na Config do Cofre — os blocos mostram só o realizado. ' +
          'Com a meta preenchida, cada bloco ganha alvo e status.</div>';
      } else {
        var saldo = feitoAte - metaAte;
        html += '<div class="why" style="margin:11px 0 0">Até o dia ' + (mesCorrente ? diaRef : nDias) +
          ': <b>' + fN(feitoAte) + '</b> feitos contra <b>' + fN(metaAte, 0) + '</b> de meta proporcional — saldo <b style="color:' +
          (saldo >= 0 ? '#2fbf4f' : '#e46a6a') + '">' + (saldo >= 0 ? '+' : '−') + fN(Math.abs(saldo), 0) + '</b>. ' +
          'Meta cheia do mês: <b>' + fN(metaOf) + '</b>' + (meta.desafio ? ' · desafio ' + fN(meta.desafio) : '') + '.</div>';
      }
      alvo.innerHTML = html;
    }

    function marca() {
      var a = $('#blD'), b = $('#blS');
      if (a) a.setAttribute('aria-selected', BLOCOS.modo === 'd10');
      if (b) b.setAttribute('aria-selected', BLOCOS.modo === 'sem');
    }
    var bD = $('#blD'), bS = $('#blS');
    function troca(modo) { BLOCOS.modo = modo; marca(); desenhar(); if (typeof redesenharHeat === 'function') redesenharHeat(); }
    if (bD) bD.onclick = function () { troca('d10'); };
    if (bS) bS.onclick = function () { troca('sem'); };
    marca();
    desenhar();
  })();

  /* ================= termômetro do mês =================
     Substitui a curva contra a trilha da meta. A pergunta mudou: não é mais
     "estou dentro da meta", e sim "como estou contra o que a operação costuma
     fazer neste mesmo dia". A meta continua no velocímetro, no card de meses
     e no placar — não se perdeu, mudou de lugar.

     Tudo é calculado do Cofre na hora. A especificação veio acompanhada de um
     HTML de estudo com os números congelados numa constante; copiar aquilo
     daria um gráfico parado no dia da extração. A série de referência também
     é calculada: meses completos desde TERMO_INICIO e anteriores ao exibido.
     Em setembro ela vira abr–ago sozinha, sem ninguém editar lista nenhuma. */
  (function () {
    var DIAS = 31;
    var alvo = $('#psCurva');
    if (!alvo) return;

    function topoBonito(v) {
      if (!(v > 0)) return 1;
      var p = Math.pow(10, Math.floor(Math.log10(v))), e = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
      for (var i = 0; i < e.length; i++) if (e[i] * p >= v) return e[i] * p;
      return 10 * p;
    }
    function diaSemana(ymX, d) {
      return new Date(Math.floor(ymX / 100), (ymX % 100) - 1, d).getDay();
    }

    function desenhar() {
      var medida = TERMO.medida;
      var vale = function (v) { return medida === 'n' ? 1 : Number(v.venda || 0); };
      var fmt = function (x) { return medida === 'n' ? fN(x, 0) : fBRL(x); };

      /* mesma série que a Projeção de fechamento usa (acumMes/mesesRef, no
         topo do arquivo). Aqui `vale` muda com o botão Vendas × Valor. */
      function acumDe(ymX) { return acumMes(V, ymX, vale); }

      var refs = refYms.map(function (y) { return { ym: y, label: ymLabel(y), acum: acumDe(y) }; });
      var faixaLab = refs.length ? refs[0].label + '–' + refs[refs.length - 1].label : '';

      var cur = acumDe(ym);
      var fim = Math.max(1, Math.min(mesCorrente ? diaRef : nDias, nDias));
      var hojeAcum = cur[fim - 1] || 0;

      /* faixa e mediana pedem 2+ meses: com um só, a "faixa" seria a própria
         linha e a mediana fingiria ser referência */
      var env = null, d0;
      if (refs.length >= 2) {
        env = { min: [], max: [], med: [] };
        for (d0 = 0; d0 < DIAS; d0++) {
          var col = refs.map(function (r) { return r.acum[d0]; });
          env.min.push(Math.min.apply(null, col));
          env.max.push(Math.max.apply(null, col));
          env.med.push(medianaDe(col));
        }
      }

      /* perfil: fração do total do mês já feita até cada dia, na mediana dos
         meses de referência — "no dia 15 costuma-se ter 42% do mês feito".
         O card de Projeção usa o MESMO perfil (na contagem) para dizer quanta
         fé a projeção merece. */
      var perfil = refs.length ? perfilMediano(refs.map(function (r) { return r.acum; })) : null;

      /* projeção: só no mês em curso e só se há de onde projetar. Assume que
         o resto do mês se comporta como a mediana histórica — não sabe de
         feriado, campanha nem vendedor de férias. Não é meta. */
      var proj = null, totalProj = null;
      if (TERMO.proj && mesCorrente && perfil && perfil[fim - 1] > 0 && hojeAcum > 0) {
        totalProj = hojeAcum / perfil[fim - 1];
        proj = [];
        for (var q = fim - 1; q < nDias; q++) proj.push(perfil[q] * totalProj);
      }

      var w = 720, h = 300, px = 48, pr = 78, py = 16, pb = 34;
      var iw = w - px - pr, ih = h - py - pb;
      var topo = topoBonito(Math.max(
        env ? Math.max.apply(null, env.max) : 0,
        totalProj || 0,
        Math.max.apply(null, cur.slice(0, fim)), 1) * 1.06);
      var X = function (d) { return px + (d - 1) * iw / (DIAS - 1); };
      var Y = function (v) { return py + ih - (v / topo) * ih; };
      var svg = S(w, h);
      var passo = iw / (DIAS - 1);

      /* fins de semana do mês exibido: explicam por que a curva deita */
      for (var fd = 1; fd <= nDias; fd++) {
        var dw = diaSemana(ym, fd);
        if (dw !== 0 && dw !== 6) continue;
        N('rect', { x: Math.max(px, X(fd) - passo / 2), y: py, width: passo, height: ih,
                    fill: '#ffffff', opacity: .025 }, svg);
      }

      for (var t = 0; t <= 4; t++) {
        var vv = topo * t / 4, yv = Y(vv);
        N('line', { x1: px, y1: yv, x2: px + iw, y2: yv, stroke: C.grid }, svg);
        T(px - 8, yv + 3, medida === 'n' ? fN(vv, 0) : fBRL(vv), 'axis-t', 'end', svg);
      }
      [1, 5, 10, 15, 20, 25, nDias].forEach(function (d) {
        T(X(d), py + ih + 18, String(d), 'axis-t', 'middle', svg);
      });
      T(px + iw / 2, py + ih + 31, 'dia do mês', 'axis-t', 'middle', svg);

      var rot = [];
      if (env) {
        var band = '', b1, b2;
        for (b1 = 0; b1 < DIAS; b1++) band += (b1 ? 'L' : 'M') + X(b1 + 1) + ' ' + Y(env.max[b1]);
        for (b2 = DIAS - 1; b2 >= 0; b2--) band += 'L' + X(b2 + 1) + ' ' + Y(env.min[b2]);
        N('path', { d: band + 'Z', fill: C.gray, opacity: .13 }, svg);
      }
      if (TERMO.meses) refs.forEach(function (r) {
        var p1 = '';
        for (var k = 0; k < DIAS; k++) p1 += (k ? 'L' : 'M') + X(k + 1) + ' ' + Y(r.acum[k]);
        N('path', { d: p1, stroke: C.gray, 'stroke-width': 1.5, fill: 'none', opacity: .42,
                    'stroke-linecap': 'round' }, svg);
        rot.push({ y: Y(r.acum[DIAS - 1]), t: r.label, c: C.muted, s: 10.5, w: 400 });
      });
      if (env) {
        var pm = '';
        for (var m1 = 0; m1 < DIAS; m1++) pm += (m1 ? 'L' : 'M') + X(m1 + 1) + ' ' + Y(env.med[m1]);
        N('path', { d: pm, stroke: C.gray, 'stroke-width': 2, fill: 'none',
                    'stroke-dasharray': '6 4', 'stroke-linecap': 'round' }, svg);
        rot.push({ y: Y(env.med[DIAS - 1]), t: 'mediana', c: C.ink2, s: 11, w: 500 });
      }

      N('line', { x1: X(15), y1: py + 6, x2: X(15), y2: py + ih, stroke: C.muted,
                  'stroke-dasharray': '2 5', opacity: .8 }, svg);
      T(X(15) + 5, py + 13, 'fim da 1ª quinzena', 'axis-t', 'start', svg);

      if (proj) {
        var pp = '';
        for (var j = 0; j < proj.length; j++) pp += (j ? 'L' : 'M') + X(fim + j) + ' ' + Y(proj[j]);
        N('path', { d: pp, stroke: C.accent, 'stroke-width': 2, fill: 'none',
                    'stroke-dasharray': '3 5', opacity: .62, 'stroke-linecap': 'round' }, svg);
        N('circle', { cx: X(nDias), cy: Y(totalProj), r: 3.5, fill: C.accent, opacity: .62 }, svg);
        rot.push({ y: Y(totalProj), t: '≈ ' + fmt(totalProj), c: C.accent, s: 11, w: 600 });
      }

      /* rótulos da direita empilham quando as linhas chegam juntas ao dia 31 */
      rot.sort(function (a, b) { return a.y - b.y; });
      var GAP = 13, r1, r2;
      for (r1 = 1; r1 < rot.length; r1++)
        if (rot[r1].y - rot[r1 - 1].y < GAP) rot[r1].y = rot[r1 - 1].y + GAP;
      for (r2 = rot.length - 1; r2 > 0; r2--)
        if (rot[r2].y > py + ih) {
          rot[r2].y = py + ih;
          if (rot[r2].y - rot[r2 - 1].y < GAP) rot[r2 - 1].y = rot[r2].y - GAP;
        }
      rot.forEach(function (r) {
        var tx = T(px + iw + 8, r.y, r.t, 'axis-t', 'start', svg);
        tx.setAttribute('fill', r.c);
        tx.setAttribute('font-size', r.s);
        tx.setAttribute('font-weight', r.w);
      });

      var pc = '';
      for (var c1 = 0; c1 < fim; c1++) pc += (c1 ? 'L' : 'M') + X(c1 + 1) + ' ' + Y(cur[c1]);
      if (fim === 1) pc += 'L' + X(1) + ' ' + Y(cur[0]);
      N('path', { d: pc, stroke: C.card, 'stroke-width': 6, fill: 'none',
                  'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
      N('path', { d: pc, stroke: C.accent, 'stroke-width': 2.75, fill: 'none',
                  'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
      N('circle', { cx: X(fim), cy: Y(hojeAcum), r: 5, fill: C.accent, stroke: C.card,
                    'stroke-width': 2 }, svg);
      var dy = (env && hojeAcum >= env.med[fim - 1]) ? -14 : 22;
      var tv = T(X(fim) - 7, Y(hojeAcum) + dy, fmt(hojeAcum), 'val-t', 'end', svg);
      tv.setAttribute('fill', C.accent);
      T(X(fim) - 7, Y(hojeAcum) + dy + 13, ymLabel(ym) + ', dia ' + fim, 'axis-t', 'end', svg);

      var ch = N('line', { x1: 0, y1: py, x2: 0, y2: py + ih, stroke: C.muted, opacity: 0 }, svg);
      for (var hd = 1; hd <= DIAS; hd++) (function (d) {
        var r = N('rect', { x: X(d) - passo / 2, y: py, width: passo, height: ih,
                            fill: 'transparent' }, svg);
        var linhas = [];
        if (d <= fim) linhas.push('<b>' + fmt(cur[d - 1]) + '</b> acumulado');
        else if (proj && d >= fim) linhas.push('<b>' + fmt(proj[d - fim]) + '</b> projetado');
        if (env) {
          linhas.push('mediana ' + fmt(env.med[d - 1]));
          linhas.push('faixa ' + fmt(env.min[d - 1]) + ' – ' + fmt(env.max[d - 1]));
          if (d <= fim) {
            var df = cur[d - 1] - env.med[d - 1];
            linhas.push('vs mediana ' + (df >= 0 ? '+' : '−') + fmt(Math.abs(df)));
          }
        }
        var nd = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][diaSemana(ym, d)];
        r.dataset.tip = '<b>dia ' + d + ' · ' + nd + '</b><br><span>' + linhas.join('<br>') + '</span>';
        r.addEventListener('mouseenter', function () {
          ch.setAttribute('x1', X(d)); ch.setAttribute('x2', X(d)); ch.setAttribute('opacity', .45);
        });
        r.addEventListener('mouseleave', function () { ch.setAttribute('opacity', 0); });
      })(hd);

      alvo.innerHTML = '';
      alvo.appendChild(svg);
      bindTips(svg);

      var leg = $('#psTermoLeg');
      if (leg) leg.innerHTML =
        '<span><i style="background:' + C.accent + '"></i>' + esc(ymLabel(ym)) + '</span>' +
        (proj ? '<span><i style="background:' + C.accent + ';opacity:.6"></i>projeção</span>' : '') +
        (env ? '<span><i style="background:' + C.gray + '"></i>mediana ' + esc(faixaLab) + '</span>' +
               '<span><i style="background:' + C.gray + ';opacity:.3"></i>faixa mín.–máx.</span>' : '') +
        (TERMO.meses && refs.length ? '<span><i style="background:' + C.gray +
               ';opacity:.45"></i>meses individuais</span>' : '');

      var cap = $('#psTermoCap');
      if (cap) {
        if (!refs.length) {
          cap.innerHTML = 'Sem mês completo desde ' + ymLabel(TERMO_INICIO) +
            ' para comparar — o gráfico mostra só ' + esc(ymLabel(ym)) + '.';
        } else {
          var noDia = refs.map(function (r) { return fmt(r.acum[fim - 1]); }).join(' · ');
          cap.innerHTML = 'No dia ' + fim + ', ' + esc(ymLabel(ym)) + ' está em <b>' + fmt(hojeAcum) + '</b>' +
            (env ? ', ' + (hojeAcum >= env.med[fim - 1] ? 'acima' : 'abaixo') + ' da mediana' : '') +
            ' — ' + esc(faixaLab) + ' marcavam ' + noDia + ' neste mesmo dia.' +
            (refs.length < 2 ? ' Com menos de dois meses de referência, faixa e mediana ficam ocultas.' : '');
        }
      }

      var tw = $('#psTermoTab');
      if (tw) {
        if (!TERMO.tabela) tw.innerHTML = '';
        else {
          var th = '<table class="placar"><thead><tr><th>Dia</th><th class="num">' + esc(ymLabel(ym)) + '</th>' +
            (env ? '<th class="num">Mediana</th><th class="num">Mín.</th><th class="num">Máx.</th><th class="num">Dif.</th>' : '') +
            '</tr></thead><tbody>';
          for (var td = 1; td <= nDias; td++) {
            var cel = td <= fim ? fmt(cur[td - 1])
              : (proj && td >= fim ? '<span style="color:var(--muted)">' + fmt(proj[td - fim]) + '</span>' : '—');
            th += '<tr><td>' + td + '</td><td class="num">' + cel + '</td>';
            if (env) {
              var dif = td <= fim ? cur[td - 1] - env.med[td - 1] : null;
              th += '<td class="num">' + fmt(env.med[td - 1]) + '</td>' +
                    '<td class="num">' + fmt(env.min[td - 1]) + '</td>' +
                    '<td class="num">' + fmt(env.max[td - 1]) + '</td>' +
                    '<td class="num">' + (dif === null ? '—' : (dif >= 0 ? '+' : '−') + fmt(Math.abs(dif))) + '</td>';
            }
            th += '</tr>';
          }
          tw.innerHTML = th + '</tbody></table>';
        }
      }

      /* o gráfico é largo; no celular ele desliza dentro do card */
      if (window.__rolarLargos) window.__rolarLargos();
    }

    function marca() {
      var a = $('#tmN'), b = $('#tmV');
      if (a) a.setAttribute('aria-selected', TERMO.medida === 'n');
      if (b) b.setAttribute('aria-selected', TERMO.medida === 'v');
    }
    var bN = $('#tmN'), bV = $('#tmV');
    if (bN) bN.onclick = function () { TERMO.medida = 'n'; marca(); desenhar(); };
    if (bV) bV.onclick = function () { TERMO.medida = 'v'; marca(); desenhar(); };
    ['meses', 'proj', 'tabela'].forEach(function (k) {
      var n = $('#tm_' + k);
      if (!n) return;
      n.checked = TERMO[k];
      n.onchange = function () { TERMO[k] = n.checked; desenhar(); };
    });
    marca();
    desenhar();
  })();

  /* heatmap meses × dia do mês — pedido do Ricardo em 07/09. O gráfico por dia
     da semana (8 semanas) só servia para escala de trabalho; a pergunta da
     gestão é "o mês fecha no fim?", a mesma que gerou a meta em blocos. Este é
     o exame do remédio: os traços verticais são as fronteiras dos blocos, na
     régua do card de cima (mudam com o botão decêndios/semanas). */
  redesenharHeat = function () {
    var alvo = $('#psHeat'), nota = $('#psHeatNota');
    alvo.innerHTML = ''; nota.innerHTML = '';
    var ult = null;
    V.forEach(function (v) { if (v.data && (!ult || v.data > ult)) ult = v.data; });
    if (!ult) { alvo.innerHTML = '<div class="vazio">sem datas</div>'; return; }
    var ymUlt = Number(ult.slice(0, 4)) * 100 + Number(ult.slice(5, 7));
    var NM = 6, meses6 = [];
    for (var i = NM - 1; i >= 0; i--) meses6.push(ymShift(ymUlt, -i));
    var porMes = {};
    meses6.forEach(function (y) { porMes[y] = []; for (var d = 0; d <= 31; d++) porMes[y].push(0); });
    V.forEach(function (v) {
      if (!v.data) return;
      var y = Number(v.data.slice(0, 4)) * 100 + Number(v.data.slice(5, 7)), d = Number(v.data.slice(8, 10));
      if (porMes[y] && d >= 1 && d <= 31) porMes[y][d]++;
    });
