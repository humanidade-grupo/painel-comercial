  function mesesDoPeriodo(chave) {
    if (chave === 'tudo') return safra.map(function (x) { return x.ym; });
    if (chave === 'sem') return (K.mix.semestre && K.mix.semestre.length)
      ? K.mix.semestre.slice() : safra.map(function (x) { return x.ym; });
    return [chave];
  }
  /* O período em números — a mesma conta serve os tiles e a composição do
     recebimento, e por isso ela mora num lugar só. */
  function somaPeriodo(chave) {
    var dentro = mesesDoPeriodo(chave);
    var r = { vgv: 0, vendas: 0, a_vista: 0, cartao: 0, carne: 0,
              novo: 0, carteira: 0, a_receber: 0, meses: dentro };
    safra.forEach(function (x) {
      if (dentro.indexOf(x.ym) < 0) return;
      r.vgv += x.vgv; r.vendas += x.vendas;
    });
    (K.recebimento.por_mes || []).forEach(function (m) {
      if (dentro.indexOf(m.ym) < 0) return;
      r.a_vista += m.a_vista; r.cartao += m.cartao; r.carne += m.carne;
      r.novo += (m.novo || 0); r.carteira += (m.carteira || 0);
    });
    safra.forEach(function (x) {
      if (dentro.indexOf(x.ym) < 0) return;
      r.a_receber += (x.a_receber || 0);
    });
    r.total = r.a_vista + r.cartao + r.carne;
    r.rotulo = dentro.length === 1 ? ymLabel(ymN(dentro[0]))
             : (ymLabel(ymN(dentro[0])) + ' a ' + ymLabel(ymN(dentro[dentro.length - 1])));
    return r;
  }
  function pintaTiles(chave, mediana) {
    var p = somaPeriodo(chave);
    var tot = p.total;
    /* FAIXA DA VENDA: tudo aqui é do mês em que o contrato foi assinado */
    $('#psCpSecVenda').textContent = 'O que ' +
      (p.meses.length === 1 ? esc(p.rotulo) : 'o período') + ' vendeu';
    $('#psCpSelo1').textContent = 'venda · ' + p.rotulo;
    $('#psCpTWhy').textContent = 'contratado em ' + p.rotulo;
    $('#psCpTVal').textContent = rs(p.vgv);
    $('#psCpTSt').textContent = (chave === 'tudo' && K.base.cortesias)
      ? fN(K.base.cortesias) + ' cortesia(s) contam venda e ficam fora do valor'
      : 'não é caixa: é o que foi assinado no período';
    $('#psCpTQtd').textContent = fN(p.vendas);
    $('#psCpTQtdSt').textContent = p.vendas
      ? 'ticket médio de ' + rs(p.vgv / p.vendas) : '—';
    $('#psCpTMed').textContent = rs((mediana && mediana.ticket) || 0);

    /* FAIXA DO CAIXA: os três repartem UM bolo, e o bolo fica escrito no
       título da faixa — era a pergunta que o Ricardo fez sobre os 66% */
    /* a frase é do Ricardo, e a palavra que a sustenta é PREVISTO: o Cofre
       sabe o que venceu, não o que foi pago — e a taxa da adquirente ainda não
       está descontada. Dizer "entrou" aqui seria prometer o que não temos. */
    $('#psCpSecCaixa').innerHTML = 'em ' + esc(p.rotulo) + ' · <b>' + rs(tot) +
      '</b> — os três cartões abaixo repartem este total e mostram o valor ' +
      'previsto para entrar na conta do Parque em ' + esc(p.rotulo);
    CERTEZA.forEach(function (t, i) {
      $('#psCpN' + i).innerHTML = rs(p[t[1]]) + ' <small>· ' +
        fPct(tot ? p[t[1]] / tot * 100 : 0, 0) + ' do total</small>';
    });
  }

  /* -------- o que entra no mês -------- */
  g.appendChild(el('<div class="sect"><h2>O que entra no mês</h2><div class="ln"></div>' +
    '<span class="tag">vendido · recebido</span></div>'));

  var cVend = el('<div class="card s8"><span class="selo venda">venda</span> ' +
    '<span class="selo caixa">caixa</span><h3>Vendido × recebimento</h3>' +
    '<div class="why">barra = receita contratada no mês · risca = dinheiro disponível no mês, ' +
    'de todas as safras</div><div id="psCpVend"></div>' +
    '<div class="legend"><span><i style="background:' + C.accent + '"></i>Receita contratada no mês</span>' +
    '<span><i style="background:' + C.ink2 + ';height:2px;border-radius:0;width:14px"></i>Dinheiro disponível no mês</span></div>' +
    '<div class="why rodape">A barra é o que o mês vendeu; a risca é o dinheiro que ficou ' +
    'disponível no mês, somando todas as safras. Parcela de cartão parcelado entra 30 dias ' +
    'depois do vencimento: o Parque não antecipa recebível.</div></div>');
  var cNat = el('<div class="card s4"><span class="selo caixa">caixa</span>' +
    '<h3>Composição mês a mês</h3>' +
    '<div class="why">a mesma divisão dos três cartões acima, em cada mês da série</div>' +
    '<div id="psCpNatMes"></div>' +
    '<div class="why rodape">Três naturezas, três graus de certeza. À vista é fato: não existe ' +
    'venda no Parque sem pagamento no ato. Cartão debita sozinho. Carnê depende de o cliente ' +
    'pagar — o Cofre registra vencimento, não baixa.</div></div>');
  g.appendChild(cVend); g.appendChild(cNat);

  /* DINHEIRO NOVO × CARTEIRA — o corte que o gestor pediu em 19/09.
     O mês recebe de duas origens que não se parecem: venda fechada agora (o
     comercial produziu) e parcela de venda antiga (a carteira paga sozinha).
     Um mês pode cair de vendas e subir de caixa, ou o contrário, e o número
     somado esconde as duas coisas. O terceiro bloco é a outra ponta da mesma
     conta: o que as vendas do período ainda vão trazer depois. */
  g.appendChild(el('<div class="card s12"><span class="selo caixa">caixa</span>' +
    '<h3>De onde vem o dinheiro do período</h3>' +
    '<div class="why">venda fechada no período · carteira de vendas anteriores · e o que as ' +
    'vendas do período ainda trazem</div>' +
    '<div id="psCpFonte"></div><div class="barra320" id="psCpFonteBarra"></div>' +
    '<div class="why rodape">Dinheiro novo é o que entrou de venda assinada no próprio período. ' +
    'Carteira é parcela de venda antiga — ela chega sem ninguém vender de novo. A terceira ' +
    'coluna não é caixa deste período: é o que as vendas dele ainda vão trazer, se todo mundo ' +
    'pagar.</div></div>'));

  /* barra = VGV da safra · risca = o que ficou disponível naquele mês */
  (function () {
    var rec = {}, recMes = K.recebimento.por_mes || [];
    recMes.forEach(function (m) { rec[m.ym] = m.a_vista + m.cartao + m.carne; });
    var w = 1000, h = 268, svg = S(w, h);
    var topo = 0;
    safra.forEach(function (s) { topo = Math.max(topo, s.vgv, rec[s.ym] || 0); });
    topo = topo * 1.06 || 1;
    var y0 = 232, yTopo = 34, alt = y0 - yTopo;
    function yy(v) { return y0 - (v / topo) * alt; }
    [0, topo / 2, topo].forEach(function (v) {
      N('line', { x1: 46, y1: yy(v), x2: w - 6, y2: yy(v), stroke: C.grid }, svg);
      T(40, yy(v) + 3.5, fN(v / 1000, 0), 'axis-t', 'end', svg);
    });
    var n = safra.length || 1, passo = (w - 60) / n;
    safra.forEach(function (s, i) {
      var cx = 46 + passo * (i + .5), r = rec[s.ym] || 0;
      var ultimo = (i === n - 1);
      var b = N('rect', { x: cx - 13, y: yy(s.vgv), width: 26, height: y0 - yy(s.vgv),
        fill: C.accent, opacity: ultimo ? .6 : 1 }, svg);
      b.dataset.tip = '<b>' + esc(ymLabel(ymN(s.ym))) + '</b><br><span>vendido ' + fBRL(s.vgv) +
        ' em ' + fN(s.vendas) + ' vendas<br>recebido ' + fBRL(r) + '</span>';
      N('line', { x1: cx - 18, y1: yy(r), x2: cx + 18, y2: yy(r), stroke: C.ink2,
        'stroke-width': 2 }, svg);
      T(cx, yy(s.vgv) - 6, fN(s.vgv / 1000, 0), 'val-t', 'middle', svg);
      T(cx, yy(r) - 4, fN(r / 1000, 0), 'axis-t', 'middle', svg);
      T(cx, 252, ymLabel(ymN(s.ym)), 'axis-t', 'middle', svg);
      if (ultimo) T(cx, 264, 'parcial', 'axis-t', 'middle', svg);
    });
    $('#psCpVend').appendChild(svg); bindTips(svg);
  })();


  (function () {
    var linhas = K.recebimento.por_mes || [];
    var w = 320, h = 6 + linhas.length * 16, svg = S(w, h);
    var maior = 0;
    linhas.forEach(function (m) { maior = Math.max(maior, m.a_vista + m.cartao + m.carne); });
    linhas.forEach(function (m, i) {
      var yTop = 2 + i * 16, x = 42;
      T(0, yTop + 8, ymLabel(ymN(m.ym)), 'axis-t', 'start', svg);
      [['a_vista', 'À vista'], ['cartao', 'Cartão'], ['carne', 'Carnê']].forEach(function (par) {
        var v = m[par[0]]; if (!v) return;
        var bw = maior ? (v / maior) * (w - 46) : 0;
        var r = N('rect', { x: x, y: yTop + 1, width: Math.max(bw, 1.5), height: 8, rx: 4,
          fill: CN[par[0]] }, svg);
        r.dataset.tip = '<b>' + esc(ymLabel(ymN(m.ym))) + ' · ' + par[1] + '</b><br><span>' +
          fBRL(v) + '</span>';
        x += bw;
      });
    });
    $('#psCpNatMes').appendChild(svg); bindTips(svg);
  })();

  /* -------- como fecha a venda · por vendedor (seguem o período) -------- */
  var chaveMes = String(Math.floor(ym / 100)) + '-' + ('0' + (ym % 100)).slice(-2);
  var per = K.mix.periodos || {};
  var periodo = per[chaveMes] ? chaveMes : (per['tudo'] ? 'tudo' : Object.keys(per)[0]);

  /* UM SELETOR SÓ (19/09/26, 2ª rodada). A moldura de fora tinha os chips de
     mês e a seção tinha as pílulas de período: dois controles do mesmo assunto
     na mesma tela, um em cima do outro. Ficou o de baixo, com os meses DENTRO
     dele — e os chips saíram do painel pai nesta aba. O período aqui é local:
     mudar o mês na Receita não mexe no mês do Executivo, porque aqui ele
     escolhe também Semestre e Tudo, que lá não existem. */
  var mesesDoPacote = safra.map(function (x) { return x.ym; }).slice().reverse();
  var opcoes = mesesDoPacote.map(function (m) { return [m, ymLabel(ymN(m))]; })
    .concat([['sem', 'Semestre'], ['tudo', 'Tudo']]);

  var seg = $('#psCpSeg');
  opcoes.forEach(function (o) {
    if (!per[o[0]]) return;
    var b = el('<button type="button">' + esc(o[1]) + '</button>');
    b.setAttribute('aria-selected', o[0] === periodo ? 'true' : 'false');
    b.onclick = function () {
      periodo = o[0];
      seg.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-selected', 'false'); });
      b.setAttribute('aria-selected', 'true');
      pintaPeriodo();
    };
    seg.appendChild(b);
  });
  g.appendChild(el('<div class="sect"><h2>Como fecha a venda</h2><div class="ln"></div>' +
    '<span class="tag">momento · forma · prazo, no período escolhido</span></div>'));

  g.appendChild(el('<div class="card s4"><span class="selo venda">venda</span>' +
    '<h3>Momento do pagamento</h3>' +
    '<div class="why">quando o cliente paga, lido no carnê</div>' +
    '<div id="psCpMom"></div><div id="psCpMomTab"></div>' +
    '<div class="why rodape">O momento sai do carnê: primeira parcela 1,5 vez maior que as ' +
    'demais é entrada. Não usa meio de pagamento — o meio parou de ser registrado em 14/08 e ' +
    'não volta por dedução.</div></div>'));
  g.appendChild(el('<div class="card s4"><span class="selo venda">venda</span>' +
    '<h3>Forma de pagamento</h3>' +
    '<div class="why">participação nas vendas do período</div><div id="psCpMeio"></div>' +
    '<div class="why rodape">A forma é o instrumento; o momento, ao lado, é a decisão ' +
    'comercial. Os meios de agosto e setembro foram reconstruídos à mão, um a um.</div></div>'));
  g.appendChild(el('<div class="card s4"><span class="selo venda">venda</span><h3>Prazo</h3>' +
    '<div class="why">em quantas vezes o cliente fechou</div><div id="psCpPrazo"></div>' +
    '<div class="why rodape">O prazo é o que o cliente leva embora e o que a casa financia. ' +
    'As vendas em 1x são as mesmas do balde à vista.</div></div>'));
  g.appendChild(el('<div class="card s12"><span class="selo venda">venda</span>' +
    '<h3>A venda típica de cada forma</h3>' +
    '<div class="why">medianas do período · e quanto de cada real vendido entra na assinatura</div>' +
    '<div id="psCpTipica"></div>' +
    '<div class="why rodape">O jazigo custa praticamente o mesmo nas quatro formas. O cliente ' +
    'não escolhe produto, escolhe prazo — e o prazo decide quanto entra no mês da venda.</div></div>'));

  g.appendChild(el('<div class="sect"><h2>Por vendedor</h2><div class="ln"></div>' +
    '<span class="tag">não é ranking — a mistura depende do cliente que chega</span></div>'));
  g.appendChild(el('<div class="card s12"><span class="selo venda">venda</span>' +
    '<h3>Como cada um fecha</h3>' +
    '<div class="why">barra = participação de cada forma · assinatura = quanto o cliente pagou ' +
    'no ato</div><div id="psCpVend2"></div>' +
    '<div class="why rodape">A tabela ordena por quanto de cada real vendido entra na ' +
    'assinatura. Quem está fora da equipe aparece marcado. Vendedor com menos de cinco vendas ' +
    'no período fica de fora.</div></div>'));

  function pintaPeriodo() {
    var B = per[periodo] || { meio: [], prazo: [], momento: [], vendedores: [], vendas: 0 };
    pintaTiles(periodo, B.mediana);

    /* a abertura fala do período escolhido, como o resto da tela */
    var md = B.mediana || { ticket: 0, ato: 0, prazo: 0 };
    var maisComum = B.meio.slice().sort(function (a, b) { return b.vendas - a.vendas; })[0];
    var pr = somaPeriodo(periodo);
    $('#psCpOlho').textContent = 'Parque da Saudade · Receita contratada · ' + pr.rotulo;
    /* DOIS MONTES, DUAS FRASES (19/09/26). A mediana da assinatura do conjunto
       inteiro cai no vale entre quem paga tudo e quem paga a 1ª parcela: em
       set/26 deu R$ 838 num mês cuja média foi R$ 6.075. Número certo,
       retrato de ninguém. O parágrafo passa a separar os dois mundos. */
    function pega(nome) {
      return (B.momento || []).filter(function (x) { return x.nome === nome; })[0]
             || { vendas: 0, ato_mediano: 0 };
    }
    var mVista = pega('À vista'), mEnt = pega('Entrada + parcelas'), mPar = pega('Parcelado');
    var txt = 'No período, o cliente do Parque contrata um jazigo de <b>' + rs(md.ticket) +
      '</b> e divide em <b>' + vezes(md.prazo) + '</b> — medianas de ' + fN(B.vendas) + ' vendas.';
    /* cada número é a mediana do SEU grupo. Juntar os três num só devolveria o
       problema que esta frase corrige — e média de medianas não é mediana. */
    if (mVista.vendas) txt += ' Na assinatura há mundos diferentes: <b>' + fN(mVista.vendas) +
      '</b> pagaram o jazigo inteiro (mediana <b>' + rs(mVista.ato_mediano) + '</b>)';
    if (mEnt.vendas) txt += (mVista.vendas ? ', ' : ' Na assinatura, ') + '<b>' + fN(mEnt.vendas) +
      '</b> deram entrada (mediana <b>' + rs(mEnt.ato_mediano) + '</b>)';
    if (mPar.vendas) txt += (mVista.vendas || mEnt.vendas ? ' e ' : ' ') + '<b>' + fN(mPar.vendas) +
      '</b> pagaram só a primeira parcela (mediana <b>' + rs(mPar.ato_mediano) + '</b>)';
    if (mVista.vendas || mEnt.vendas || mPar.vendas) txt += '.';
    if (maisComum) txt += ' A forma mais usada é <b>' + esc(maisComum.nome.toLowerCase()) +
      '</b>, em ' + fN(maisComum.vendas) + ' delas.';
    $('#psCpDeck').innerHTML = txt;

    /* de onde vem o dinheiro: venda do próprio período × carteira, e a cauda */
    var fonte = $('#psCpFonte');
    fonte.innerHTML = '<div class="blocos">' +
      '<div class="bloco"><div class="per">Dinheiro novo</div><div class="n">' + curto(pr.novo) +
      '</div><div class="st">venda fechada no período · ' +
      fPct(pr.total ? pr.novo / pr.total * 100 : 0, 0) + ' do que entrou</div></div>' +
      '<div class="bloco"><div class="per">Carteira</div><div class="n">' + curto(pr.carteira) +
      '</div><div class="st">parcela de venda anterior · ' +
      fPct(pr.total ? pr.carteira / pr.total * 100 : 0, 0) + ' do que entrou</div></div>' +
      '<div class="bloco"><div class="per">Ainda vem</div><div class="n">' + curto(pr.a_receber) +
      '</div><div class="st">das vendas deste período, nos próximos meses</div></div></div>';
    var fbar = $('#psCpFonteBarra'); fbar.innerHTML = '';
    quebraCard(fbar, [{ n: 'Dinheiro novo', v: pr.novo }, { n: 'Carteira', v: pr.carteira }],
      pr.total, 'em caixa', [C.accent, C.gray]);

    /* a barra de 100% saiu daqui: ela repetia, em desenho, os três cartões de
       caixa da faixa de cima. Ficou só o histórico mês a mês, que é o que este
       card tem de próprio. */

    var mom = $('#psCpMom'); mom.innerHTML = '';
    quebraCard(mom, B.momento.map(function (x) { return { n: x.nome, v: x.vendas }; }),
      B.vendas, 'vendas', [C.accent, C.blue, C.mag]);
    var atoTot = 0; B.momento.forEach(function (x) { atoTot += x.ato; });
    var tab = '<table class="placar" style="margin-top:10px"><tr><th>Momento</th>' +
      '<th class="num">Vendas</th><th class="num">Mediana</th><th class="num">Na assinatura</th>' +
      '<th class="num">% do ato</th></tr>';
    B.momento.forEach(function (x, i) {
      tab += '<tr><td><i class="dot" style="background:' + [C.accent, C.blue, C.mag][i] + '"></i>' +
        esc(x.nome) + '</td><td class="num">' + fN(x.vendas) + '</td><td class="num">' +
        (x.vendas ? fN(x.ato_mediano || 0, 0) : '–') + '</td><td class="num">' +
        fN(x.ato, 0) + '</td><td class="num">' + fPct(atoTot ? x.ato / atoTot * 100 : 0, 0) +
        '</td></tr>';
    });
    $('#psCpMomTab').innerHTML = tab + '</table>';

    var cm = $('#psCpMeio'); cm.innerHTML = '';
    var porMeio = B.meio.slice().sort(function (a, b) { return b.vendas - a.vendas; });
    quebraCard(cm, porMeio.map(function (x) { return { n: x.nome, v: x.vendas }; }),
      B.vendas, 'vendas', porMeio.map(function (x) { return CM[x.nome] || C.gray; }));

    var cp = $('#psCpPrazo'); cp.innerHTML = '';
    quebraCard(cp, B.prazo.map(function (x) { return { n: x.faixa, v: x.vendas }; }),
      B.vendas, 'vendas', [C.ramp[3], C.ramp[2], C.ramp[1], C.ramp[0], C.heat[1]]);

    var t = '<table class="placar"><tr><th>Forma</th><th class="num">Vendas</th>' +
      '<th class="num">Vezes</th><th class="num">Assinatura</th><th class="num">Jazigo</th>' +
      '<th class="num">% do vendido</th></tr>';
    B.meio.forEach(function (x) {
      t += '<tr><td><i class="dot" style="background:' + (CM[x.nome] || C.gray) + '"></i>' +
        esc(x.nome) + '</td><td class="num">' + fN(x.vendas) + '</td><td class="num">' +
        vezes(x.prazo_mediano) + '</td><td class="num">' + fN(x.ato_mediano, 0) +
        '</td><td class="num">' + fN(x.ticket_mediano, 0) + '</td><td class="num">' +
        fPct(x.pct_ato, 1) + '</td></tr>';
    });
    $('#psCpTipica').innerHTML = t + '</table>';

    var vs = (B.vendedores || []).filter(function (v) { return v.vendas >= 5; });
    var foraDaLista = (B.vendedores || []).length - vs.length;
    vs.sort(function (a, b) {
      if (a.fora !== b.fora) return a.fora ? 1 : -1;      // quem saiu da equipe vai para o fim
      return b.pct_ato - a.pct_ato;
    });
    var hv = '<table class="placar"><tr><th style="width:150px">Vendedor</th>' +
      '<th>Formas de pagamento</th><th class="num" style="width:58px">Vendas</th>' +
      '<th class="num" style="width:62px">Prazo</th><th class="num" style="width:104px">Assinatura</th>' +
      '<th class="num" style="width:74px">% do vendido</th></tr>';
    vs.forEach(function (v) {
      var ordem = ['Boleto', 'Cartão', 'PIX', 'PIX + cartão'];
      var barra = '<svg viewBox="0 0 340 14" style="height:14px">';
      var x = 0;
      ordem.forEach(function (nome) {
        var q = v.meios[nome] || 0; if (!q) return;
        var bw = (q / v.vendas) * 338;
        barra += '<rect x="' + x.toFixed(1) + '" y="3" width="' + Math.max(bw - 2, 2).toFixed(1) +
          '" height="8" rx="4" fill="' + (CM[nome] || C.gray) + '"></rect>';
        x += bw;
      });
      hv += '<tr><td>' + esc(v.nome) + (v.fora ?
        ' <span class="axis-t" style="font-style:italic">fora da equipe</span>' : '') +
        '</td><td>' + barra + '</svg></td><td class="num">' + fN(v.vendas) +
        '</td><td class="num">' + vezes(v.prazo_mediano) + '</td><td class="num">' +

  /* só ícone: com dois botões rotulados a barra encostava nos títulos longos
     ("Projeção de fechamento"); o rótulo aparece só na volta, por 2 s */
  var COP_ABRIR = COP_ICONE;
  var COP_OK = '<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg><span class="rot">copiado</span>';
  var COP_BAIXOU = '<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg><span class="rot">baixado</span>';
  var COP_ERRO = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg><span class="rot">falhou</span>';
  var libImagem = null;
  function carregarLibImagem() {
    if (window.htmlToImage) return Promise.resolve(window.htmlToImage);
    if (libImagem) return libImagem;
    libImagem = new Promise(function (ok, falha) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
      s.onload = function () { window.htmlToImage ? ok(window.htmlToImage) : falha(new Error('html-to-image vazio')); };
      s.onerror = function () { libImagem = null; falha(new Error('sem rede para html-to-image')); };
      document.head.appendChild(s);
    });
    return libImagem;
  }
  function nomeDoCard(card) {
    var h = card.querySelector('h3');
    var t = (h ? h.textContent : 'card').trim().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return 'painel-' + (t || 'card') + '.png';
  }
  function copiarCard(card, b) {
    if (b.disabled) return;
    b.disabled = true;
    var fundo = getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#0b1220';
    var png = carregarLibImagem().then(function (lib) {
      return lib.toBlob(card, {
        pixelRatio: 2,
        backgroundColor: fundo,
        filter: function (n) { return !(n.classList && n.classList.contains('btacoes')); }
      });
    }).then(function (blob) {
      if (!blob) throw new Error('imagem vazia');
      return blob;
    });
    function marcar(html, cls) {
      b.innerHTML = html; b.classList.remove('ok', 'erro'); if (cls) b.classList.add(cls);
      b.disabled = false;
      setTimeout(function () { b.innerHTML = COP_ABRIR; b.classList.remove('ok', 'erro'); }, 1800);
    }
    function baixar() {
      return png.then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = nomeDoCard(card);
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
        marcar(COP_BAIXOU, 'ok');
      });
    }
    var escrita = (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)
      ? navigator.clipboard.write([new ClipboardItem({ 'image/png': png })])
          .then(function () { marcar(COP_OK, 'ok'); }, function (e) {
            console.warn('copiarCard: área de transferência recusou, baixando', e);
            return baixar();
          })
      : baixar();
    escrita.catch(function (e) { console.error('copiarCard:', e); marcar(COP_ERRO, 'erro'); });
  }

  function ligarExpandir() {
    if (!document.querySelector('.card.expandido')) document.body.classList.remove('expandindo');
    var cards = document.querySelectorAll('#gridEU .card, #gridPS .card');
    Array.prototype.forEach.call(cards, function (card) {
      var barra = card.querySelector('.btacoes');
      if (!barra) {
        barra = document.createElement('div');
        barra.className = 'btacoes';
        card.appendChild(barra);
      }
      if (!barra.querySelector('.btcopia')) {
        var c = document.createElement('button');
        c.type = 'button'; c.className = 'btcopia'; c.innerHTML = COP_ABRIR;
        c.setAttribute('aria-label', 'Copiar como imagem');
        c.title = 'Copiar como imagem';
        c.onclick = function (ev) { ev.stopPropagation(); copiarCard(card, c); };
        barra.appendChild(c);
      }
      if (barra.querySelector('.btexp')) return;
      if (!card.querySelector('svg[viewBox]')) return;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btexp'; b.innerHTML = EXP_ABRIR;
      b.setAttribute('aria-label', 'Expandir gráfico');
      b.onclick = function (ev) {
        ev.stopPropagation();
        var aberto = card.classList.contains('expandido');
        fecharExpandido();
        if (aberto) return;
        card.classList.add('expandido');
        document.body.classList.add('expandindo');
        b.innerHTML = EXP_FECHAR;
        b.setAttribute('aria-label', 'Fechar');
        card.scrollTop = 0;
      };
      barra.appendChild(b);  /* expandir fica na ponta direita, onde sempre esteve */
    });
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') fecharExpandido();
  });

  window.__rolarLargos = rolarLargos; /* o termômetro redesenha sozinho ao trocar controle */
  ['__renderEU', '__renderPS'].forEach(function (nome) {
    var orig = window[nome];
    if (typeof orig !== 'function') return;
    window[nome] = function () {
      var r = orig.apply(this, arguments);
      try { rolarLargos(); } catch (e) { console.error('rolarLargos:', e); }
      try { ligarExpandir(); } catch (e) { console.error('ligarExpandir:', e); }
      return r;
    };
  });

  /* a moldura nao adivinha a altura do conteudo; quem sabe e esta pagina */
  function avisarAltura() {
    if (!EMBUTIDO) return;
    try {
      var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
      parent.postMessage({ tipo: 'v2:altura', altura: h }, location.origin);
    } catch (e) {}
  }
  if (EMBUTIDO) {
    window.addEventListener('load', avisarAltura);
    window.addEventListener('resize', avisarAltura);
    try { new ResizeObserver(avisarAltura).observe(document.body); } catch (e) {}
  }

  var carga = document.getElementById('carga');
  /* Embutida, esta página não busca nada — então não tem passo para narrar.
     "lendo a Estrela…" por cima de uma Estrela já desenhada é pior que
     silêncio: descreve trabalho que não está acontecendo. */
  function passo(t) { if (EMBUTIDO) return; var p = document.getElementById('cargaPasso'); if (p) p.textContent = t; }
  function fecharCarga() { if (!carga) return; carga.style.opacity = '0'; setTimeout(function () { if (carga && carga.parentNode) carga.remove(); carga = null; }, 320); }

  function selo(texto, velho) {
    var el2 = document.getElementById('selo');
    if (!el2) { el2 = document.createElement('div'); el2.id = 'selo'; document.body.appendChild(el2); }
    el2.className = velho ? 'velho' : '';
    el2.innerHTML = texto;
    document.body.classList.add('tem-selo');
  }
  var CARIMBO = { eu: '', ps: '', copia: false, msEu: 0, msPs: 0 };
  function atualizarSelo(emp) {
    var ps = (emp === 'ps');
    var nome = ps ? 'Parque da Saudade' : 'Estrela Urbanidade';
    var quando = (ps ? CARIMBO.ps : CARIMBO.eu) || '(sem carimbo)';
    if (CARIMBO.copia) selo('⚠ <b>Sem conexão com o Cofre.</b> Cópia local — ' + nome + ' atualizado em <b>' + quando + '</b>.', true);
    else if (EMBUTIDO) {
      /* Discreto de propósito: quem está aqui já leu de qual empresa é a aba e
         já tem o selo do painel de fora. O que falta é só a hora da carga. */
      selo('atualizado em <b>' + quando + '</b>');
    } else {
      var ms = ps ? CARIMBO.msPs : CARIMBO.msEu;
      selo('v2 · Cofre — ' + nome + ' · atualizado em <b>' + quando + '</b>' + (ms ? ' · resposta em ' + (ms / 1000).toFixed(1) + 's' : ''));
    }
  }

  var DADOS = null, YM_PS = null, YM_EU = null; /* YM_EU = fim da janela 12m da Estrela; null = mês da última venda */

  function preencherMeses() {
    var sel = $('#selMes');
    var ps = DADOS && DADOS.ps;
    if (!sel || !ps || !ps.meses || !ps.meses.length) return;
    sel.innerHTML = ps.meses.map(function (m) { return '<option value="' + m.ym + '">' + esc(m.rotulo) + '</option>'; }).join('');
    sel.value = String(YM_PS || ps.meses[0].ym);
    sel.onchange = function () { YM_PS = Number(sel.value); try { window.__renderPS(DADOS.ps, YM_PS); } catch (e) { console.error(e); } };
  }

  function trocarEmpresa(emp) {
    var ps = (emp === 'ps');
    document.body.classList.toggle('emp-ps', ps);
    document.body.classList.toggle('emp-eu', !ps);
    $('#empPS').setAttribute('aria-selected', ps);
    $('#empEU').setAttribute('aria-selected', !ps);
    if (!EMBUTIDO) { try { localStorage.setItem(CHAVE_EMP, ps ? 'ps' : 'eu'); } catch (e) {} }
    /* re-render na cor da empresa (as cores dos SVGs são resolvidas na hora) */
    if (DADOS) {
      if (ps) { try { window.__renderPS(DADOS.ps, YM_PS); } catch (e) { console.error('PS:', e); } }
      else { try { window.__renderEU(DADOS, YM_EU); } catch (e) { console.error('EU:', e); } }
    }
    atualizarSelo(ps ? 'ps' : 'eu');
    window.scrollTo({ top: 0 });
  }

  function subir(dados, deCopia, ymPS, ymEU) {
    DADOS = dados;
    if (!dados.ps) dados.ps = { vendas: [], meses: [], metas: {}, erro: dados.psErro || 'não carregou' };
    YM_PS = (dados.ps.meses && dados.ps.meses.length) ? dados.ps.meses[0].ym : null;
    /* embutida, o mês já escolhido lá fora chega junto do dado — sem isto a
       moldura abriria sempre no mês padrão, discordando dos chips acima dela */
    ymPS = Number(ymPS) || 0;
    if (ymPS && (dados.ps.meses || []).some(function (m) { return m.ym === ymPS; })) YM_PS = ymPS;
    if (Number(ymEU)) YM_EU = Number(ymEU);
    fecharCarga();
    var g2 = document.getElementById('gate'); if (g2) g2.remove();
    CARIMBO.eu = dados.atualizado_em || '';
    CARIMBO.ps = (dados.ps && dados.ps.atualizado_em) || '';
    CARIMBO.copia = !!deCopia;
    CARIMBO.msEu = dados.ms || 0; CARIMBO.msPs = (dados.ps && dados.ps.ms) || 0;
    preencherMeses();
    $('#empPS').onclick = function () { trocarEmpresa('ps'); };
    $('#empEU').onclick = function () { trocarEmpresa('eu'); };
    ligarRecarregar();
    var salvo = EMP_URL || 'eu';
    if (!EMP_URL) { try { salvo = localStorage.getItem(CHAVE_EMP) || 'eu'; } catch (e) {} }
    trocarEmpresa(salvo);
  }

  function comPrazo(url, ms, oque) {
    return new Promise(function (resolve, reject) {
      var venceu = false;
      var t = setTimeout(function () { venceu = true; reject(new Error(oque + ' não respondeu em ' + (ms / 1000) + 's')); }, ms);
      fetch(url).then(function (r) { return r.json(); })
        .then(function (j) { if (!venceu) { clearTimeout(t); resolve(j); } })
        .catch(function (e) { if (!venceu) { clearTimeout(t); reject(e); } });
    });
  }

  /* em série, como no painel atual: o Apps Script enfileira execuções */
  function buscar(token, sincronizar) {
    var q = API + '?token=' + encodeURIComponent(token);
    var sEU = (sincronizar === 'eu') ? '&sync=1' : '';
    var sPS = (sincronizar === 'ps') ? '&sync=1' : '';
    passo(sEU ? 'importando as vendas da Estrela…' : 'lendo a Estrela…');
    return comPrazo(q + '&app=estrela&fn=dados' + sEU, sEU ? 90000 : 30000, 'A Estrela').then(function (eu) {
      if (!eu || !eu.ok) return eu || { ok: false };
      passo(sPS ? 'importando as vendas do Parque…' : 'lendo o Parque…');
      return comPrazo(q + '&app=vendas&fn=dados' + sPS, sPS ? 90000 : 30000, 'O Parque').then(function (ps) {
        if (ps && ps.ok) eu.ps = ps; else { eu.ps = null; eu.psErro = (ps && ps.error) || 'resposta sem dado'; }
        return eu;
      }).catch(function (e) { eu.ps = null; eu.psErro = String(e.message || e); return eu; });
    });
  }

  function recado(j) {
    var e = (j && j.error) ? String(j.error) : '';
    if (!e) return 'O Cofre respondeu sem dado. Recarregue; se insistir, é erro do servidor.';
    if (/token/i.test(e)) return 'Token não aceito. Confira e tente de novo.';
    return 'O token passou, mas o Cofre falhou ao montar o dado:\n' + e;
  }
  function tokenRuim(j) { return !j || !j.error || /token/i.test(String(j.error)); }

  /* SINCRONIZAR DE VERDADE — só o Parque precisa (24/08/2026). Mesma razão e
     mesmo desenho do painel de fora: com `painel.fonte_vendas = ambas` os
     números do Parque vêm do CRM Facilita, e o `&sync=1` não busca lá. Quem
     busca é esta rota, que roda as três etapas dentro do Cofre. ~1 min na
     rodada incremental; o teto de 5 min é para o dia com atraso acumulado. */
  function sincronizarNoCofre(token) {
    passo('buscando as vendas no Facilita…');
    // &so=facilita (06/09): só a etapa do CRM, ~40 s — como no painel de fora
    return comPrazo(API + '?token=' + encodeURIComponent(token) + '&app=sync&fn=rodar&so=facilita',
                    300000, 'A sincronização');
  }

  /* Entende as duas respostas: a nova, por empresa, e a antiga, de uma só. */
  function recadoSync(r, emp) {
    var nome = (emp === 'ps') ? 'Parque da Saudade' : 'Estrela Urbanidade';
    if (!r) return null;
    if (r.empresas) {
      if (!r.empresas.length) {
        return { txt: '⚠ Não rodei agora — <b>' + esc(r.motivo) +
                      '</b>. A tela mostra a última importação boa.', bom: false };
      }
      var partes = r.empresas.map(function (e) {
        return e.erro ? '<b>' + esc(e.nome) + '</b> falhou: ' + esc(e.erro)
                      : '<b>' + esc(e.nome) + '</b> ' + esc(e.resumo || 'ok');
      });
      var seg = r.duracao_ms ? ' · ' + Math.round(r.duracao_ms / 1000) + 's' : '';
      return { txt: (r.ok ? '✓ Sincronizado — ' : '⚠ Sincronizado com falha — ') +
                    partes.join(' · ') + seg, bom: !!r.ok };
    }
    if (r.feito)   return { txt: '✓ <b>' + nome + '</b> importado agora — ' + esc(r.resumo || ''), bom: true };
    if (r.recente) return { txt: '✓ <b>' + nome + '</b> já estava atualizado' + (r.motivo ? ' (' + esc(r.motivo) + ')' : ''), bom: true };
    return { txt: '⚠ Não consegui importar o <b>' + nome + '</b>: ' + esc(String(r.motivo || '?')) +
                  '. A tela mostra a última importação boa.', bom: false };
  }

  function ligarRecarregar() {
    var bt = document.getElementById('btRec');
    if (!bt) return;
    bt.onclick = function () {
      var token = localStorage.getItem(CHAVE_TOKEN);
      if (!token) { location.reload(); return; }
      bt.disabled = true; bt.classList.add('girando');
      var rot = bt.querySelector('.rot');
      var emp = document.body.classList.contains('emp-ps') ? 'ps' : 'eu';
      var noParque = (emp === 'ps');
      if (rot) rot.textContent = noParque ? 'sincronizando…' : 'buscando…';

      /* Um botão só, que sabe onde está: na Estrela a fonte é planilha e o
         &sync=1 resolve em segundos; no Parque a fonte é o CRM e quem busca é
         a rota de sincronização. Depois dela a tela relê SEM &sync=1 — a
         importação já aconteceu. */
      (noParque ? sincronizarNoCofre(token) : Promise.resolve(null))
        .then(function (sync) {
          return buscar(token, noParque ? null : emp).then(function (j) {
            if (!j || !j.ok) throw new Error((j && j.error) || 'resposta sem dado');
            try { localStorage.setItem(CHAVE_CACHE, JSON.stringify(j)); } catch (e) {}
            var s = noParque ? sync : j.sync;
            subir(j, false);
            bt.disabled = false; bt.classList.remove('girando'); if (rot) rot.textContent = 'Atualizar';
            var rc = recadoSync(s, emp);
            if (rc) {
              selo(rc.txt, !rc.bom);
              if (rc.bom) setTimeout(function () { atualizarSelo(emp); }, 8000);
            }
          });
        }).catch(function (e) {
        bt.disabled = false; bt.classList.remove('girando');
        if (rot) rot.textContent = 'falhou';
        selo('⚠ Não consegui atualizar: <b>' + esc(String(e.message || e)) + '</b>. Os números na tela são os de antes.', true);
        setTimeout(function () { if (rot) rot.textContent = 'Atualizar'; }, 4000);
      });
    };
  }

  function doCache() { try { return JSON.parse(localStorage.getItem(CHAVE_CACHE) || 'null'); } catch (e) { return null; } }

  function portao(mensagem) {
    if (carga) carga.style.display = 'none';
    if (document.getElementById('gate')) {
      if (mensagem) document.querySelector('#gate .err').textContent = mensagem;
      return;
    }
    var d = document.createElement('div');
    d.id = 'gate';
    d.innerHTML = '<div class="box"><h2>Painel Comercial · v2</h2>' +
      '<p>Digite o token de acesso — o mesmo do painel atual. Ele fica guardado neste aparelho.</p>' +
      '<input id="tk" type="password" autocomplete="off" placeholder="token" spellcheck="false">' +
      '<button id="ok">Entrar</button><div class="err" id="er">' + esc(mensagem || '') + '</div></div>';
    document.body.appendChild(d);
    var inp = document.getElementById('tk'), bt = document.getElementById('ok'), er = document.getElementById('er');
    inp.focus();
    function tentar() {
      var t = inp.value.trim();
      if (!t) return;
      bt.disabled = true; er.textContent = 'verificando…';
      if (carga) carga.style.display = '';
      buscar(t).then(function (j) {
        if (j && j.ok) {
          localStorage.setItem(CHAVE_TOKEN, t);
          try { localStorage.setItem(CHAVE_CACHE, JSON.stringify(j)); } catch (e) {}
          subir(j, false);
        } else {
          bt.disabled = false; er.textContent = recado(j);
          if (carga) carga.style.display = 'none';
          if (!tokenRuim(j)) { try { localStorage.setItem(CHAVE_TOKEN, t); } catch (e) {} }
        }
      }).catch(function () {
        bt.disabled = false; er.textContent = 'Não consegui falar com o Cofre. Verifique a conexão.';
        if (carga) carga.style.display = 'none';
      });
    }
    bt.addEventListener('click', tentar);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') tentar(); });
  }

  var token = null;
  try { token = localStorage.getItem(CHAVE_TOKEN); } catch (e) {}

  /* EMBUTIDA: o dado vem da página de fora, não do Cofre.
     Quem abre esta aba já está olhando uma tela montada com estes mesmos
     números. Buscar de novo é pagar duas vezes pela mesma resposta — e fazer a
     pessoa esperar por ela.
     A rede continua sendo o plano B: se o pai não responder em 4s (moldura
     aberta direto pela URL, ou painel de fora numa versão que não sabe
     responder), esta página se vira sozinha como antes. Moldura em branco
     seria pior que moldura lenta. */
  if (EMBUTIDO) {
    var atendida = false;
    window.addEventListener('message', function (ev) {
      if (ev.origin !== location.origin) return;
      var d = ev.data;
      if (!d) return;
      /* os chips de mês vivem no painel de fora; a troca chega por aqui */
      if (d.tipo === 'v2:mes') {
        var ym = Number(d.ym) || 0;
        if (!ym || !DADOS) return;
        if (d.emp === 'ps') {
          YM_PS = ym;
          var sel = document.getElementById('selMes'); if (sel) sel.value = String(ym);
          if (document.body.classList.contains('emp-ps')) { try { window.__renderPS(DADOS.ps, YM_PS); } catch (e) { console.error(e); } }
        } else {
          YM_EU = ym;
          if (document.body.classList.contains('emp-eu')) { try { window.__renderEU(DADOS, YM_EU); } catch (e) { console.error(e); } }
        }
        return;
      }
      /* O histórico congelado da Estrela (17/09) vem da página de fora, que o
         busca quando a aba Histórico abre. Pode chegar depois do dado — aí
         redesenha a Estrela, como na troca de mês. Mesmo canal, nenhum fetch. */
      if (d.tipo === 'v2:historico') {
        window.__HIST_EU = d.historico || null;
        if (DADOS && document.body.classList.contains('emp-eu')) { try { window.__renderEU(DADOS, YM_EU); } catch (e) { console.error(e); } }
        return;
      }
      if (atendida || d.tipo !== 'v2:dados' || !d.dados) return;
      atendida = true;
      if (d.historico) window.__HIST_EU = d.historico;
      subir(d.dados, false, d.ymPS, d.ymEU);
    });
    try { parent.postMessage({ tipo: 'v2:pronto' }, location.origin); } catch (e) {}
    setTimeout(function () { if (!atendida) { atendida = true; pelaRede(); } }, 4000);
    return;
  }

  pelaRede();

  function pelaRede() {
  if (!token) { portao(''); return; }

  buscar(token).then(function (j) {
    if (j && j.ok) {
      try { localStorage.setItem(CHAVE_CACHE, JSON.stringify(j)); } catch (e) {}
      subir(j, false);
    } else if (tokenRuim(j)) {
      try { localStorage.removeItem(CHAVE_TOKEN); } catch (e) {}
      portao('O token deixou de valer. Digite o novo.');
    } else {
      var c = doCache();
      if (c) { subir(c, true); }
      else if (carga) {
        carga.innerHTML = '<div style="text-align:center;max-width:420px;line-height:1.6;padding:0 20px">' +
          'O Cofre respondeu com erro.<br><span style="color:#f87171;font-size:13px;word-break:break-word">' +
          esc(String(j.error)) + '</span><br><span style="color:#64748b;font-size:13px">O token está válido — isto é falha do servidor.</span></div>';
      }
    }
  }).catch(function () {
    var c = doCache();
    if (c) { subir(c, true); }
    else if (carga) carga.innerHTML = '<div style="text-align:center;max-width:320px;line-height:1.6">' +
      'Não consegui falar com o Cofre e não há cópia neste aparelho.<br>' +
      '<span style="color:#64748b;font-size:13px">Verifique a conexão e recarregue.</span></div>';
  });
  }
})();
</script>
</body>
</html>
